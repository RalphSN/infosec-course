<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>資訊安全風險與防護工程</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;family=LXGW+WenKai+TC:wght@400;700&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
:root{
  --bg:#EDF1F4; --bg-2:#E3E9EF; --surface:#FBFCFD; --surface-2:#F3F6F9;
  --ink:#152231; --ink-2:#34465A; --muted:#617186; --line:#D2DBE4; --line-strong:#B4C2D0;
  --accent:#0B6E78; --accent-hover:#085C64; --accent-ink:#FFFFFF; --accent-soft:#D9EEF0;
  --amber:#C98E00; --amber-soft:#FFF2CF; --amber-ink:#5F4200;
  --red:#C2352E; --red-soft:#FBE4E2; --red-ink:#761C17;
  --blue:#2D5DA4; --blue-soft:#E0E9F6; --green:#2B7A4B; --green-soft:#DCF0E3;
  --c-c:#2D5DA4; --c-i:#7A4BB0; --c-a:#2B7A4B;
  --r1:#CDE8D6; --r2:#F9E4A0; --r3:#F5BF8E; --r4:#EE9C95; --r-ink:#1B2530;
  --shadow:0 1px 2px rgba(21,34,49,.06),0 6px 20px rgba(21,34,49,.07);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --f-tech:"Chakra Petch","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-story:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","Noto Sans TC",serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --fs:17px; --rail:276px; --read:42rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D141B; --bg-2:#121B24; --surface:#151F29; --surface-2:#1A2632;
    --ink:#E3EAF1; --ink-2:#C0CCD8; --muted:#8D9CAD; --line:#253340; --line-strong:#344658;
    --accent:#45C1CB; --accent-hover:#6AD0D8; --accent-ink:#052528; --accent-soft:#113439;
    --amber:#F0B43A; --amber-soft:#33290F; --amber-ink:#FFDC8C;
    --red:#EF6D61; --red-soft:#3A1B19; --red-ink:#FFC4BD;
    --blue:#83A9E6; --blue-soft:#172740; --green:#62C88F; --green-soft:#14301F;
    --c-c:#83A9E6; --c-i:#B996E8; --c-a:#62C88F;
    --r1:#1D3A29; --r2:#473A13; --r3:#55331B; --r4:#5C2421; --r-ink:#E3EAF1;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D141B; --bg-2:#121B24; --surface:#151F29; --surface-2:#1A2632;
  --ink:#E3EAF1; --ink-2:#C0CCD8; --muted:#8D9CAD; --line:#253340; --line-strong:#344658;
  --accent:#45C1CB; --accent-hover:#6AD0D8; --accent-ink:#052528; --accent-soft:#113439;
  --amber:#F0B43A; --amber-soft:#33290F; --amber-ink:#FFDC8C;
  --red:#EF6D61; --red-soft:#3A1B19; --red-ink:#FFC4BD;
  --blue:#83A9E6; --blue-soft:#172740; --green:#62C88F; --green-soft:#14301F;
  --c-c:#83A9E6; --c-i:#B996E8; --c-a:#62C88F;
  --r1:#1D3A29; --r2:#473A13; --r3:#55331B; --r4:#5C2421; --r-ink:#E3EAF1;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
}
:root[data-fs="s"]{--fs:15.5px}
:root[data-fs="l"]{--fs:19px}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.85;letter-spacing:.01em}
a{color:var(--accent);text-underline-offset:3px}
a:hover{color:var(--accent-hover)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
code,kbd,.mono{font-family:var(--f-mono);font-size:.88em}
code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:.05em .35em}
kbd{border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:0 .35em;background:var(--surface)}
svg text{font-family:var(--f-body)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tabnum{font-variant-numeric:tabular-nums}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px 28px;display:flex;flex-direction:column;gap:14px;z-index:30}
.rail-brand{display:flex;flex-direction:column;gap:2px;padding:4px 8px 10px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.rail-brand small{font-family:var(--f-tech);font-weight:600;font-size:.72rem;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.rail-brand b{font-size:1.02rem;line-height:1.4;font-weight:900}
.rail-prog{display:flex;align-items:center;gap:10px;padding:0 8px;font-size:.8rem;color:var(--muted)}
.rail-prog .bar{flex:1;height:6px;border-radius:99px;background:var(--bg-2);overflow:hidden}
.rail-prog .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.rail-links{display:grid;gap:2px}
.rail-link{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:.92rem}
.rail-link:hover{background:var(--surface-2);color:var(--ink)}
.rail-link[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.rail-link svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.badge{margin-left:auto;min-width:22px;height:20px;border-radius:99px;background:var(--amber);color:#1b1400;font-size:.72rem;font-weight:700;display:inline-grid;place-items:center;padding:0 6px;font-family:var(--f-tech)}
.rail-stage{margin-top:6px}
.rail-stage h3{margin:0;padding:6px 10px;font-size:.74rem;font-weight:700;color:var(--muted);letter-spacing:.06em;display:flex;gap:8px;align-items:baseline}
.rail-stage h3 span{font-family:var(--f-tech);color:var(--accent);letter-spacing:.1em}
.rail-lesson{display:grid;grid-template-columns:30px 1fr 16px;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:.9rem;line-height:1.45}
.rail-lesson:hover{background:var(--surface-2);color:var(--ink)}
.rail-lesson .num{font-family:var(--f-tech);font-weight:600;font-size:.82rem;color:var(--muted)}
.rail-lesson[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:700}
.rail-lesson[aria-current="page"] .num{color:var(--accent)}
.rail-lesson.is-soon{color:var(--muted)}
.rail-lesson .st{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-strong)}
.rail-lesson.is-done .st{background:var(--green);border-color:var(--green);box-shadow:inset 0 0 0 3px var(--surface)}
.rail-lesson.is-soon .st{border-style:dashed}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:10px;padding:10px 20px;min-height:56px}
.crumb{min-width:0;flex:1;font-size:.86rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--ink);font-weight:700}
.ibtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.ibtn:hover{border-color:var(--line-strong);color:var(--ink)}
.ibtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8}
.ibtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.ibtn.txt{width:auto;padding:0 10px;font-size:.8rem;font-weight:700;font-family:var(--f-tech);letter-spacing:.04em}
#menuBtn{display:none}
.scrollbar{height:4px;background:transparent;position:relative;overflow:hidden}
.scrollbar i{position:absolute;inset:0 auto 0 0;width:0;background:repeating-linear-gradient(-45deg,var(--amber) 0 8px,color-mix(in srgb,var(--amber) 60%,var(--ink)) 8px 16px);transition:width .1s linear}

.stage-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:40px;padding:28px 20px 80px;max-width:calc(var(--read) + 260px + 40px + 40px);width:100%;margin:0 auto}
.stage-wrap.has-toc{grid-template-columns:minmax(0,var(--read)) 220px;justify-content:center}
#view{min-width:0;width:100%;max-width:var(--read);margin:0 auto}
#view:focus{outline:none}

/* ---------- Reading typography ---------- */
#view h1{font-size:clamp(1.7rem,1.3rem + 1.6vw,2.3rem);line-height:1.3;font-weight:900;margin:.2em 0 .3em;text-wrap:balance;letter-spacing:.01em}
#view h2{font-size:1.36rem;line-height:1.4;font-weight:900;margin:2.4em 0 .7em;text-wrap:balance;scroll-margin-top:84px;display:flex;gap:.55em;align-items:baseline}
#view h2 .h2n{font-family:var(--f-tech);font-size:.78em;font-weight:600;color:var(--accent);letter-spacing:.06em;flex:none}
#view h3{font-size:1.1rem;font-weight:700;margin:1.8em 0 .5em;text-wrap:balance;scroll-margin-top:84px}
#view p{margin:.75em 0}
#view ul,#view ol{padding-left:1.4em;margin:.7em 0}
#view li{margin:.3em 0}
#view li::marker{color:var(--muted)}
.lead{font-weight:700}

.scroll-x{overflow-x:auto;margin:1em 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.scroll-x.bare{border:0;background:none}
table.tbl{border-collapse:collapse;width:100%;min-width:560px;font-size:.92em;line-height:1.6}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--line)}
.tbl th{font-size:.82em;font-weight:700;color:var(--muted);background:var(--surface-2);letter-spacing:.04em}
.tbl tr:last-child td{border-bottom:0}
.tbl .en{display:block;font-family:var(--f-tech);font-size:.84em;color:var(--muted)}
.tbl td.letter{font-family:var(--f-tech);font-weight:700;font-size:1.3em;color:var(--accent);width:44px}
.swipe-hint{display:none;font-size:.78rem;color:var(--muted);margin:-.6em 0 1em}

.story{font-family:var(--f-story);font-size:1.08em;line-height:1.95;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 22px;position:relative}
.story::before{content:"情境";position:absolute;top:-11px;left:18px;font-family:var(--f-body);font-size:.72rem;font-weight:700;letter-spacing:.12em;background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 8px}
.limit{background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:12px;padding:12px 16px;font-size:.96em}
.limit b:first-child{display:block;font-size:.8em;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}

/* Callouts */
.co{border-radius:14px;padding:16px 20px;margin:1.4em 0;border:1px solid transparent}
.co-h{display:flex;align-items:center;gap:8px;font-weight:900;font-size:.95em;margin-bottom:.3em}
.co-h svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9}
.co p:last-child{margin-bottom:0}
.co-aha{background:var(--amber-soft);border-color:color-mix(in srgb,var(--amber) 40%,transparent)}
.co-aha .co-h{color:var(--amber-ink)}
.co-warn{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 35%,transparent)}
.co-warn .co-h{color:var(--red-ink)}
.co-quote{font-weight:700;font-size:1.05em}
.co-info{background:var(--blue-soft);border-color:color-mix(in srgb,var(--blue) 30%,transparent)}
.co-info .co-h{color:var(--blue)}
.co-terms{background:var(--surface);border-color:var(--line)}
.co-terms .co-h{color:var(--ink-2)}
.terms{margin:.6em 0 0;display:grid;gap:10px}
.terms div{display:grid;grid-template-columns:minmax(8.5em,max-content) 1fr;gap:4px 14px}
.terms dt{font-weight:700}
.terms dt .en{display:block;font-family:var(--f-tech);font-weight:500;font-size:.78em;color:var(--muted);letter-spacing:.02em}
.terms dd{margin:0;color:var(--ink-2)}
.guess-echo{margin-top:.8em;padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:.93em}
.guess-echo b{display:block;font-size:.78em;letter-spacing:.06em;color:var(--muted)}

details.deep{margin:1.6em 0;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details.deep>summary{cursor:pointer;list-style:none;padding:12px 18px;font-weight:700;display:flex;align-items:center;gap:10px;color:var(--ink-2)}
details.deep>summary::-webkit-details-marker{display:none}
details.deep>summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .2s}
details.deep[open]>summary::before{transform:rotate(45deg)}
details.deep>summary small{font-weight:500;color:var(--muted);font-size:.82em}
details.deep>div{padding:0 20px 14px}

/* inline helpers */
dfn[data-term]{font-style:normal;border-bottom:1.5px dotted var(--accent);cursor:help}
dfn[data-term]:hover{background:var(--accent-soft)}
.xref{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:1px 12px 1px 4px;font-size:.88em;line-height:1.7;color:var(--ink-2);vertical-align:baseline}
.xref::before{content:attr(data-lesson);font-family:var(--f-tech);font-weight:700;font-size:.8em;background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px}
.xref:hover{border-color:var(--accent);color:var(--ink)}
.calc{font-family:var(--f-mono);font-size:.9em;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;line-height:1.9;margin:1em 0;overflow-x:auto}
.calc .row{display:grid;grid-template-columns:1.6em 1fr;gap:8px}
.calc .row span:first-child{color:var(--muted)}
.calc em{font-style:normal;color:var(--accent);font-weight:600}
.note{font-size:.88em;color:var(--muted)}

/* chain (lesson 02) */
.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:1.2em 0}
.chain .node{flex:1 1 120px;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:12px;padding:10px 12px;text-align:center;line-height:1.45}
.chain .node b{display:block;font-size:1.02em}
.chain .node small{display:block;color:var(--muted);font-size:.78em;font-family:var(--f-tech)}
.chain .node span{display:block;font-size:.84em;color:var(--ink-2);margin-top:4px}
.chain .arr{flex:0 0 auto;align-self:center;font-size:.78em;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.2;padding:0 2px}
.chain .arr::after{content:"→";font-size:1.4em;color:var(--accent)}

/* figure */
figure.fig{margin:1.4em 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
figure.fig svg{display:block;width:100%;height:auto}
figure.fig figcaption{font-size:.84em;color:var(--muted);margin-top:8px;text-align:center}

/* ---------- Lesson header ---------- */
.lh{margin-bottom:1.6em}
.lh-top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.lh-num{font-family:var(--f-tech);font-weight:700;font-size:clamp(3.2rem,2.4rem + 3vw,4.6rem);line-height:.9;color:var(--accent);letter-spacing:-.02em}
.lh-stage{font-size:.82rem;color:var(--muted);font-weight:700;letter-spacing:.06em;padding-bottom:6px}
.lh-stage span{font-family:var(--f-tech);color:var(--ink-2)}
.lh-sub{font-size:1.12rem;color:var(--ink-2);font-weight:500;margin:-.2em 0 1em}
.lh-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 20px;display:grid;gap:10px;box-shadow:var(--shadow)}
.lh-row{display:grid;grid-template-columns:6.2em 1fr;gap:12px;align-items:baseline}
.lh-row dt{font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.06em}
.lh-row dd{margin:0}
.lh-row.one dd{font-weight:700;font-size:1.04em}
.ticks{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.ticks i{width:14px;height:6px;border-radius:2px;background:var(--line)}
.ticks i.s-gap{margin-left:6px}
.ticks i.done{background:var(--green)}
.ticks i.cur{background:var(--accent);height:10px}
.ticks-l{font-family:var(--f-tech);font-size:.84rem;color:var(--muted);margin-left:8px}

/* ---------- Question cards ---------- */
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 18px 16px;margin:1.3em 0;box-shadow:var(--shadow)}
.q-head{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;letter-spacing:.06em;border-radius:99px;padding:2px 10px 2px 8px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.chip.k-warmup{color:var(--blue);background:var(--blue-soft);border-color:transparent}
.chip.k-guess{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.chip.k-check{color:var(--ink-2)}
.chip.k-practice{color:var(--ink);background:var(--bg-2);border-color:transparent}
.chip.k-review{color:var(--amber-ink);background:var(--amber-soft);border-color:transparent}
.lvl{font-size:.74rem;font-weight:700;border-radius:6px;padding:1px 8px;letter-spacing:.06em}
.lvl-y{background:var(--amber-soft);color:var(--amber-ink);border:1px solid color-mix(in srgb,var(--amber) 45%,transparent)}
.lvl-r{background:var(--red-soft);color:var(--red-ink);border:1px solid color-mix(in srgb,var(--red) 40%,transparent)}
.from{font-size:.76rem;color:var(--muted);font-family:var(--f-tech)}
.q-title{font-weight:900}
.q-prompt p:first-child{margin-top:.2em}
.q-input{display:block;width:100%;min-height:3.2em;resize:vertical;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-2);padding:8px 12px;line-height:1.6;margin:.6em 0 .2em}
.q-input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.q-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);padding:6px 14px;font-size:.88rem;font-weight:700;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.q-note{font-size:.84rem;color:var(--muted)}
.q-hint,.q-ans{border-radius:12px;padding:10px 16px;margin-top:10px;animation:rise .25s ease}
.q-hint{background:var(--blue-soft)}
.q-hint::before{content:"提示";display:block;font-size:.74rem;font-weight:700;letter-spacing:.08em;color:var(--blue)}
.q-ans{background:var(--surface-2);border:1px solid var(--line)}
.q-ans::before{content:"參考答案";display:block;font-size:.74rem;font-weight:700;letter-spacing:.08em;color:var(--accent)}
.q-ans p,.q-hint p{margin:.4em 0}
.q-rate{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;font-size:.86rem}
.q-rate>span{color:var(--muted)}
.rate{border-radius:99px;border:1px solid var(--line-strong);background:var(--surface);padding:3px 12px;font-size:.84rem;font-weight:700}
.rate[aria-pressed="true"].r-got{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.rate[aria-pressed="true"].r-part{background:var(--amber-soft);border-color:var(--amber);color:var(--amber-ink)}
.rate[aria-pressed="true"].r-miss{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
.rate-msg{flex-basis:100%;color:var(--muted);font-size:.8rem}
@keyframes rise{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

.keys{counter-reset:k;list-style:none;padding:0 !important;display:grid;gap:10px}
.keys li{counter-increment:k;display:grid;grid-template-columns:34px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 !important}
.keys li::before{content:counter(k);font-family:var(--f-tech);font-weight:700;font-size:1.3em;color:var(--accent);line-height:1.3}
.next-tease{margin-top:2.4em;padding:14px 18px;border-top:2px solid var(--ink);font-size:1.02em}
.next-tease b{font-size:.78em;letter-spacing:.1em;color:var(--muted);display:block}

.lf{margin-top:2.4em;display:grid;gap:14px}
.done-btn{justify-self:start}
.done-btn[aria-pressed="true"]{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pager a{display:block;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;text-decoration:none;color:var(--ink);line-height:1.45}
.pager a:hover{border-color:var(--accent)}
.pager a small{display:block;font-size:.76rem;color:var(--muted);font-family:var(--f-tech);letter-spacing:.06em}
.pager a.nx{text-align:right;grid-column:2}

.soon-block{background:var(--surface);border:1px dashed var(--line-strong);border-radius:16px;padding:18px 22px}
.soon-block h2{margin-top:0 !important}
.soon-tag{display:inline-block;font-size:.76rem;font-weight:700;letter-spacing:.08em;color:var(--amber-ink);background:var(--amber-soft);border-radius:6px;padding:1px 8px}

/* ---------- TOC ---------- */
.toc{position:sticky;top:84px;align-self:start;max-height:calc(100vh - 110px);overflow-y:auto;font-size:.84rem}
.toc h4{margin:0 0 8px;font-size:.72rem;letter-spacing:.12em;color:var(--muted);font-family:var(--f-tech)}
.toc ol{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.toc li{margin:0}
.toc .ta{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 0 5px 14px;margin-left:-2px;border-left:2px solid transparent;color:var(--muted);line-height:1.45;font-size:inherit;border-radius:0}
.toc .ta:hover{color:var(--ink)}
.toc .ta.on{color:var(--ink);font-weight:700;border-left-color:var(--accent)}
#view h1:focus,#view h2:focus{outline:none}
.sheet .toc{font-size:.95rem}
.sheet .toc .ta{padding:9px 0 9px 14px}
.toc-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;display:none;align-items:center;gap:6px;border-radius:99px;background:var(--ink);color:var(--bg);border:0;padding:10px 16px;font-size:.86rem;font-weight:700;box-shadow:var(--shadow)}
.toc-fab svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------- Popover / tooltip / sheet ---------- */
.pop{position:fixed;z-index:60;width:min(380px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.22);padding:14px 16px;font-size:.9rem;line-height:1.7}
.pop h5{margin:0 0 6px;font-size:.98rem;padding-right:28px}
.pop h5 small{display:block;font-family:var(--f-tech);color:var(--accent);font-size:.76rem;letter-spacing:.08em}
.pop ol{margin:.4em 0;padding-left:1.2em}
.pop .x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--muted);font-size:1.2rem}
.pop .x:hover{background:var(--surface-2);color:var(--ink)}
.tip{position:fixed;z-index:61;max-width:min(320px,calc(100vw - 32px));background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 12px;font-size:.84rem;line-height:1.6;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none}
.tip b{display:block}
.tip span{display:block;font-family:var(--f-tech);font-size:.78rem;opacity:.75}
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,22,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:70vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet .toc{position:static;max-height:none}

/* ---------- Overview ---------- */
.hero{display:grid;gap:22px;margin-bottom:2.4em}
.hero-kicker{font-family:var(--f-tech);font-weight:600;font-size:.8rem;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}
.hero h1{font-size:clamp(2rem,1.4rem + 2.6vw,3rem) !important;margin:.1em 0 .2em !important}
.hero p.tag{font-size:1.1em;color:var(--ink-2);margin:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.86rem;color:var(--muted)}
.meta b{font-family:var(--f-tech);color:var(--ink);font-size:1.08em;margin:0 3px}
.cta-row{display:flex;flex-wrap:wrap;gap:10px}
.cta-row .btn{padding:10px 18px;font-size:.95rem}
.route{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 16px 12px;box-shadow:var(--shadow)}
.route-map{display:flex;flex-wrap:wrap;gap:16px 22px}
.rs{flex:1 1 auto;min-width:0}
.rs-h{font-size:.78rem;font-weight:700;color:var(--ink-2);margin-bottom:6px;display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.rs-h span{font-family:var(--f-tech);color:var(--accent);letter-spacing:.06em}
.rs-line{display:flex;align-items:center}
.stn{position:relative;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font-family:var(--f-tech);font-weight:700;font-size:.8rem;text-decoration:none;border:2px solid var(--accent);background:var(--surface);color:var(--ink);flex:none}
.stn + .stn{margin-left:14px}
.stn + .stn::before{content:"";position:absolute;right:100%;top:50%;width:16px;height:2px;margin-right:0;background:var(--line-strong);transform:translateY(-50%)}
.stn.done{background:var(--accent);color:var(--accent-ink)}
.stn.soon{border-style:dashed;border-color:var(--line-strong);color:var(--muted)}
.stn:hover{box-shadow:0 0 0 4px var(--accent-soft)}
.route .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted);margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.route .legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:2px solid var(--accent)}
.route .legend .lg-done{background:var(--accent)}
.route .legend .lg-ready{background:var(--surface)}
.route .legend .lg-soon{border-style:dashed;border-color:var(--line-strong)}
.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:1.2em 0}
.model{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;line-height:1.65}
.model .mn{font-family:var(--f-tech);font-weight:700;color:var(--accent);font-size:1.5rem;line-height:1}
.model b{display:block;margin:.4em 0 .2em;font-size:1.02em}
.model p{margin:0 !important;font-size:.9em;color:var(--ink-2)}
.roadmap{display:grid;gap:18px;margin:1.2em 0}
.rm-stage{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.rm-stage header{display:flex;align-items:baseline;gap:10px;padding:10px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.rm-stage header b{font-family:var(--f-tech);color:var(--accent);letter-spacing:.08em;font-size:.84rem}
.rm-stage header span{font-weight:900}
.rm-stage header small{color:var(--muted);font-size:.84rem}
.rm-list{list-style:none;margin:0 !important;padding:0 !important}
.rm-list li{margin:0 !important;border-bottom:1px solid var(--line)}
.rm-list li:last-child{border-bottom:0}
.rm-list a{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:10px 16px;text-decoration:none;color:var(--ink)}
.rm-list a:hover{background:var(--surface-2)}
.rm-list .num{font-family:var(--f-tech);font-weight:700;color:var(--accent)}
.rm-list .t{line-height:1.45}
.rm-list .t small{display:block;color:var(--muted);font-size:.84em}
.pill{font-size:.72rem;font-weight:700;border-radius:99px;padding:2px 9px;letter-spacing:.04em;white-space:nowrap}
.pill.ready{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--green-soft);color:var(--green)}
.pill.soon{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line-strong)}
.log{font-size:.9em}
.log li{margin:.2em 0}

/* glossary & review */
.search{display:block;width:100%;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);padding:10px 14px;margin:1em 0}
.gl{display:grid;gap:10px}
.gl-item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;gap:2px}
.gl-item h4{margin:0;font-size:1.02rem;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.gl-item h4 span{font-family:var(--f-tech);font-weight:500;font-size:.82em;color:var(--muted)}
.gl-item p{margin:0 !important;color:var(--ink-2);font-size:.94em}
.gl-item a{font-size:.8em;font-family:var(--f-tech);justify-self:start}
.rv-group{margin:1.4em 0}
.rv-meta{display:flex;gap:10px;align-items:center;font-size:.8rem;color:var(--muted);margin-bottom:-.6em}
.rv-meta .pill{font-family:var(--f-tech)}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:14px;padding:18px 20px;color:var(--ink-2)}
.io{display:grid;gap:8px;margin-top:1em}
.io textarea{width:100%;min-height:90px;font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface-2);padding:8px 10px}
.io-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.io-msg{font-size:.84rem;color:var(--muted)}

/* ---------- Widgets (shared) ---------- */
.w{background:var(--surface);border:1.5px solid var(--line-strong);border-radius:18px;margin:1.6em 0;overflow:hidden}
.w-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.w-head .tag{font-family:var(--f-tech);font-size:.7rem;font-weight:700;letter-spacing:.14em;color:var(--accent);border:1px solid var(--accent);border-radius:5px;padding:0 6px}
.w-head b{font-size:.95rem}
.w-body{padding:14px 16px 16px}
.w-body>p:first-child{margin-top:0}
.w-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.w-out{font-size:.9rem;color:var(--ink-2)}

/* CIA sort */
.cia-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.cia-card{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.cia-card p{margin:0 !important;font-size:.92em;line-height:1.6;flex:1}
.cia-btns{display:flex;gap:6px}
.cia-btns button{flex:1;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:3px 0;font-size:.8rem;font-weight:700;line-height:1.3}
.cia-btns button small{display:block;font-weight:500;font-size:.72rem;color:var(--muted)}
.cia-btns button[data-v="C"][aria-pressed="true"]{border-color:var(--c-c);background:color-mix(in srgb,var(--c-c) 16%,var(--surface))}
.cia-btns button[data-v="I"][aria-pressed="true"]{border-color:var(--c-i);background:color-mix(in srgb,var(--c-i) 16%,var(--surface))}
.cia-btns button[data-v="A"][aria-pressed="true"]{border-color:var(--c-a);background:color-mix(in srgb,var(--c-a) 16%,var(--surface))}
.cia-card.ok{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.cia-card.bad{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.cia-fb{font-size:.84rem;line-height:1.55;border-radius:8px;padding:6px 10px;background:var(--surface-2)}
.cia-card.ok .cia-fb b{color:var(--green)}
.cia-card.bad .cia-fb b{color:var(--red)}

/* attack surface */
.as-ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 20px}
.as-ctl label{display:grid;gap:2px;font-size:.88rem;font-weight:700}
.as-ctl label output{font-family:var(--f-tech);color:var(--accent);font-size:1.05em}
.as-ctl input[type=range]{width:100%;accent-color:var(--accent)}
.as-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.as-stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.as-stat small{display:block;font-size:.76rem;color:var(--muted);font-weight:700}
.as-stat b{font-family:var(--f-tech);font-size:1.7rem;line-height:1.2;font-variant-numeric:tabular-nums}
.as-stat.bad b{color:var(--red)}
.as-stat.good b{color:var(--green)}
.doors{display:flex;flex-wrap:wrap;gap:5px;padding:10px;border-radius:12px;background:var(--surface-2);min-height:44px}
.door{width:18px;height:26px;border-radius:4px 4px 1px 1px;background:var(--line-strong);position:relative;transition:background .2s}
.door::after{content:"";position:absolute;right:3px;top:12px;width:3px;height:3px;border-radius:50%;background:var(--surface)}
.door.held{background:var(--green)}
.door.broken{background:var(--red)}

/* risk matrix */
.rm-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.rmx{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));grid-template-rows:repeat(5,minmax(52px,auto)) 26px;gap:3px;font-size:.8rem}
.rmx .ax{display:grid;place-items:center;font-family:var(--f-tech);color:var(--muted);font-weight:600}
.rmx .cell{border-radius:6px;padding:3px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;color:var(--r-ink);border:2px solid transparent;cursor:pointer;position:relative;min-width:0}
.rmx .cell:hover{border-color:var(--ink-2)}
.rmx .cell .sc{position:absolute;right:4px;bottom:1px;font-family:var(--f-tech);font-size:.7rem;opacity:.55}
.lv1{background:var(--r1)}.lv2{background:var(--r2)}.lv3{background:var(--r3)}.lv4{background:var(--r4)}
.rchip{font-family:var(--f-tech);font-weight:700;font-size:.72rem;border-radius:5px;padding:0 5px;background:var(--surface);color:var(--ink);border:1.5px solid var(--ink-2);line-height:1.5}
.rchip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rm-axis-t{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin:4px 0 0 31px}
.rm-y{font-size:.76rem;color:var(--muted);margin-bottom:4px}
.rm-list2{display:grid;gap:6px;margin:0 !important;padding:0 !important;list-style:none}
.rm-list2 li{margin:0 !important}
.rm-list2 button{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px 10px;line-height:1.45;font-size:.86rem}
.rm-list2 button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.rm-list2 .id{font-family:var(--f-tech);font-weight:700}
.lvpill{font-size:.72rem;font-weight:700;border-radius:99px;padding:1px 8px;color:var(--r-ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.rm-detail{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.88rem;line-height:1.6;background:var(--surface-2)}
.rm-detail h5{margin:0 0 4px;font-size:.92rem}
.step{display:inline-flex;align-items:center;gap:6px;margin-right:12px}
.step button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);font-weight:700;line-height:1}
.step output{font-family:var(--f-tech);font-weight:700;min-width:1ch}
.ctl-list{display:grid;gap:4px;margin-top:8px}
.ctl-list label{display:flex;gap:8px;align-items:flex-start;font-size:.86rem;line-height:1.5}
.ctl-list input{margin-top:.35em;accent-color:var(--accent)}
.ctl-list small{color:var(--muted)}
.add-risk{display:flex;gap:6px;margin-top:10px}
.add-risk input{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:5px 10px;font-size:.86rem}

/* DFD */
.dfd-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.dfd-svg{overflow-x:auto}
.dfd-svg svg{display:block;width:100%;min-width:560px;height:auto}
.dfd .ent rect,.dfd .proc circle,.dfd .store-bg{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.8}
.dfd .store line{stroke:var(--ink-2);stroke-width:2}
.dfd .lbl{font-size:16px;font-weight:700;fill:var(--ink);text-anchor:middle}
.dfd .lbl2{font-size:12.5px;fill:var(--muted);text-anchor:middle}
.dfd .flow path{stroke:var(--ink-2);stroke-width:1.8;fill:none}
.dfd .flow .hit{stroke:transparent;stroke-width:18}
.dfd .flow text{font-size:13px;fill:var(--ink-2);text-anchor:middle}
.dfd .tb{stroke:var(--red);stroke-width:1.8;stroke-dasharray:6 5;fill:none}
.dfd .tb-lbl{font-size:12.5px;fill:var(--red);font-weight:700}
.dfd .el{cursor:pointer}
.dfd .el:hover rect,.dfd .el:hover circle,.dfd .el:hover .store-bg{stroke:var(--accent)}
.dfd .el:focus{outline:none}
.dfd .el:focus-visible rect,.dfd .el:focus-visible circle,.dfd .el:focus-visible .store-bg,.dfd .el:focus-visible path:not(.hit){stroke:var(--accent);stroke-width:3}
.dfd .el.on rect,.dfd .el.on circle,.dfd .el.on .store-bg{stroke:var(--accent);stroke-width:3;fill:var(--accent-soft)}
.dfd .el.on path:not(.hit){stroke:var(--accent);stroke-width:3}
.dfd .el.on text{fill:var(--ink)}
.dfd .store .store-bg{stroke:transparent}
.dfd .store.on .store-bg,.dfd .store:hover .store-bg{stroke:var(--accent)}
.rchip.ghost{opacity:.55;border-style:dashed;background:transparent}
.dfd .arrow{fill:var(--ink-2)}
.dfd.no-tb .tbg{display:none}
.stride-panel h5{margin:0;font-size:1rem}
.stride-panel .type{font-size:.8rem;color:var(--muted);margin:2px 0 8px}
.letters{display:flex;gap:4px;margin-bottom:8px}
.letters span{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-tech);font-weight:700;border:1.5px dashed var(--line-strong);color:var(--line-strong)}
.letters span.on{border-style:solid;border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.threats{list-style:none;margin:0 !important;padding:0 !important;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.threats li{margin:0 !important;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.86rem;line-height:1.55;background:var(--surface)}
.threats li b.L{font-family:var(--f-tech);color:var(--accent);margin-right:6px}
.threats li .fix{display:block;color:var(--ink-2);margin-top:2px}
.threats li .fix::before{content:"對策 → ";color:var(--green);font-weight:700}
.legend-dfd{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.8rem;color:var(--ink-2);margin:10px 0 0}
.legend-dfd span{display:inline-flex;align-items:center;gap:6px}
.legend-dfd svg{width:26px;height:18px}
.legend-dfd svg *{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.6}
.legend-dfd svg .d{fill:none;stroke:var(--red);stroke-dasharray:4 3}

/* ---------- Focus mode ---------- */
.focus .app{grid-template-columns:minmax(0,1fr)}
.focus .rail{display:none}
.focus .stage-wrap.has-toc{grid-template-columns:minmax(0,var(--read))}
.focus .toc-side{display:none}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .stage-wrap.has-toc{grid-template-columns:minmax(0,1fr)}
  .toc-side{display:none}
  .toc-fab{display:inline-flex}
}
@media (max-width:1000px){
  .app{grid-template-columns:minmax(0,1fr)}

/* ---------- Shared widget parts (lessons 04+) ---------- */
pre.code{font-family:var(--f-mono);font-size:.82em;line-height:1.7;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:1em 0;overflow-x:auto;white-space:pre;tab-size:2;color:var(--ink)}

.bits{display:grid;grid-template-columns:repeat(32,1fr);gap:2px;margin:6px 0}

code.same{background:var(--amber-soft);border-color:var(--amber);color:var(--amber-ink)}
code.mismatch{background:var(--red-soft);border-color:var(--red);color:var(--red-ink)}
/* cert chain */
.cc-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:10px}
.certs{display:grid;gap:10px}

.warns li.bad{background:var(--red-soft);color:var(--red-ink)}

.decision.ok{border-color:var(--green);background:var(--green-soft)}

<aside class="co co-info">
  <div class="co-h">學完整門課，你能做到</div>
  <ul>
    <li>用「資產、威脅、弱點、衝擊」的語言評估任何一個系統的風險，並排出處理順序。</li>
    <li>看懂最常見的攻擊為什麼會成功，包括注入、XSS、存取控制失效、供應鏈攻擊、提示詞注入和釣魚，並說出對應的防護方法。</li>
    <li>理解密碼學、身分驗證、雲端權限這些防護工具「保證了什麼、沒保證什麼」。</li>
    <li>知道被入侵時怎麼發現、怎麼應變、怎麼復原。</li>
    <li>在總整合專題裡，為一個部署在雲端、附 AI 客服的 Vue 3 會員系統，做出完整的風險評估與防護藍圖。</li>
  </ul>
</aside>

<h2>為什麼有這門課</h2>
<p>資安新聞幾乎天天都有，但入門資料常常卡在兩個極端。一種是一堆名詞排在一起，看完還是不知道它們怎麼連起來；另一種是一開始就丟出指令和工具，沒解釋背後的道理。</p>
<p>這門課走中間那條路。每一種攻擊都先講清楚「它為什麼會成功」，因為看懂了成功的原因，防護方法幾乎都能自己推出來。整門課有一條主軸：<b>信任要被驗證，而不是被假設。</b>你會發現，後面學到的每一種攻擊，都是某個東西被錯誤地信任了。</p>
<p>如果你寫前端，第三階段會特別有感。OWASP Top 10:2025 排在最前面的幾類風險，像存取控制失效、設定錯誤、軟體供應鏈和注入，都跟每天寫的程式直接相關。</p>

<h2>怎麼讀這門課</h2>
<ul>
  <li><b>一次一課就好。</b>每課約 20 分鐘閱讀加 10 分鐘練習。頂部的斜紋進度條會顯示這一課讀到哪裡。</li>
  <li><b>每課的順序都一樣：</b>生活情境、心智模型、新名詞、正式拆解、啊哈、常見誤解、三個重點、練習。寬螢幕的右側有本課目錄，手機則在右下角。</li>
  <li><b>所有問題都有答案，但先想再看。</b>可以先在框裡寫下想法（選填），再按「揭曉答案」。對照之後按「答對了／部分對／沒想到」，答得不順的題目會自動進入複習佇列。</li>
  <li><b>練習有兩種難度。</b><span class="lvl lvl-y">應用</span> 是用本課觀念解決新情境；<span class="lvl lvl-r">挑戰</span> 要串連好幾個觀念，附有提示，卡住超過 3 分鐘再打開。</li>
  <li><b>不懂的詞點一下。</b>有虛線底線的詞，點一下（或滑鼠移過去）就有解釋。像 <button type="button" class="xref" data-lesson="01">回顧第 01 課：CIA 三要素</button> 這樣的小標籤，點了會跳出那一課的三個重點，不用離開目前的頁面。</li>
  <li><b>灰色的「延伸（可跳過）」</b>是加分內容，跳過不影響後面的課。</li>
  <li><b>需要更專注時，</b>按頂部的專注模式按鈕（或鍵盤 <kbd>F</kbd>）隱藏側欄。在課程頁面，鍵盤 <kbd>←</kbd> <kbd>→</kbd> 可以切換上一課和下一課。</li>
</ul>

<div class="q" data-kind="check" data-qid="ov-demo">
  <div class="q-prompt"><p>先試一次答題卡：設定密碼時，「很長」和「很複雜」（大小寫、數字、符號都要有），哪一個通常比較重要？</p></div>
  <div class="q-ans">
    <p><b>答案：</b>通常是長度。</p>
    <p><b>為什麼：</b>每多一個字元，可能的組合數就要再乘上幾十倍。而「一定要有大小寫、數字、符號」的規則，常讓人寫出 P@ssw0rd1 這種好記、也好猜的變化。美國 NIST 的數位身分指引也建議以長度為主，不要強制規定字元種類。第 06 課會用計算器實際算給你看。</p>
  </div>
</div>

<h2>教學方式</h2>
<aside class="co co-info">
  <div class="co-h">三個來自學習科學的設計</div>
  <p><b>先猜再學。</b>每課開頭的「先猜猜看」就算猜錯也有用。先試著回答、再看到正確答案，會比直接讀答案記得更牢。</p>
  <p><b>隔一段時間再想起來。</b>從第 02 課開始，每課開頭的「暖身回想」會問前幾課的內容。隔一段時間再從記憶裡提取一次，比一次讀很多遍有效。</p>
  <p><b>比喻要說清楚哪裡不像。</b>每個生活比喻後面都有「比喻的極限」，說明它在哪裡不成立，免得你帶著錯誤的直覺往下學。</p>
</aside>

<h2>貫穿全課的三個心智模型</h2>
<div class="models">

  <div class="model"><div class="mn">2</div><b>信任邊界</b><p>攻擊幾乎都發生在信任放錯地方的時候：資料被當成指令、客戶端被當成可信、內網被當成安全。第 03 課起。</p></div>

<h2>生活情境：出門旅行前的三個擔心</h2>
<div class="story">
  <p>週五晚上，你準備出國玩三天。拖著行李走到門口時，你停下來檢查了三件事。第一件，大門和窗戶有沒有鎖好，你不希望陌生人進來翻你的抽屜。第二件，你拜託鄰居幫忙看一下信箱，因為上個月才有人把你的帳單換成假的繳費單。第三件，冰箱的插頭有沒有插穩，你不想三天後回家，一打開冰箱就聞到酸味。</p>
  <p>仔細看，這三件事擔心的「壞結果」完全不同。第一件怕的是東西<b>被看到、被拿走</b>；第二件怕的是東西<b>被偷換、被改掉</b>；第三件怕的是需要的時候<b>用不了</b>。</p>
</div>
<div class="q" data-kind="guess" data-qid="l01-g">
  <div class="q-prompt"><p>有個駭客沒有偷走任何資料，也沒有改任何資料，只是讓一家醫院的電腦系統當機三個小時。這算不算資安事件？如果算，受損的是上面三種擔心的哪一種？</p></div>
</div>

<h2>心智模型：把家換成資訊系統</h2>
<p>資安專家把這三種擔心整理成三個詞，合起來叫 <dfn data-term="cia">CIA 三要素</dfn>。你的家對應到一個資訊系統，每個部分都有自己的名字：</p>
<div class="scroll-x">
  <table class="tbl">
    <thead><tr><th>出門前的擔心</th><th>資安的說法</th><th>白話意思</th></tr></thead>
    <tbody>
      <tr><td>門窗鎖好，別讓陌生人翻抽屜</td><td>機密性<span class="en">Confidentiality</span></td><td>只有被允許的人看得到</td></tr>
      <tr><td>信箱裡的帳單沒被偷換</td><td>完整性<span class="en">Integrity</span></td><td>內容沒被偷改；就算被改了，也能發現</td></tr>
      <tr><td>冰箱有電，回家時東西還能吃</td><td>可用性<span class="en">Availability</span></td><td>需要的時候用得到</td></tr>
      <tr><td>大門、窗戶、陽台、信箱</td><td>攻擊面<span class="en">Attack Surface</span></td><td>所有可能被碰到的入口</td></tr>
      <tr><td>闖空門的小偷</td><td>攻擊者<span class="en">Attacker</span></td><td>想造成傷害的人</td></tr>
    </tbody>
  </table>
</div>
<p class="swipe-hint">← 表格可以左右滑動 →</p>
<p class="limit"><b>比喻的極限</b>家被闖入，你通常會發現：門被撬開、東西不見了。但資料被偷時，原本那份還好好地在原處，因為複製不會留下空缺。所以很多公司被入侵好幾個月都不知道。另外，一個家只有幾扇門窗，一個網站系統可能有成千上萬個入口。</p>

<aside class="co co-terms">
  <div class="co-h">本課新名詞</div>
  <dl class="terms">
    <div><dt>資訊安全<span class="en">Information Security</span></dt><dd>保護資訊和承載它的系統，讓資訊維持該有的機密性、完整性、可用性。常簡稱「資安」。</dd></div>
    <div><dt>機密性<span class="en">Confidentiality</span></dt><dd>只有被允許的人看得到。</dd></div>
    <div><dt>完整性<span class="en">Integrity</span></dt><dd>內容沒有被未經允許地修改；被改了也能被發現。</dd></div>
    <div><dt>可用性<span class="en">Availability</span></dt><dd>被允許的人在需要的時候用得到。</dd></div>
    <div><dt>攻擊面<span class="en">Attack Surface</span></dt><dd>系統所有可能被攻擊者碰到的入口總和。</dd></div>
  </dl>
</aside>

<h2>正式拆解①：CIA 三要素</h2>
<p><b class="lead">「這個系統安全嗎？」其實是個沒辦法回答的問題，因為「安全」太模糊了。</b>CIA 把它拆成三個可以一個一個檢查的問題：誰看得到？內容可信嗎？需要時用得到嗎？</p>

<p><b>機密性</b>問的是「誰看得到」。你的病歷只有你和醫生能看，這就是機密性。破壞機密性的方式很多：資料庫被整份下載、有人從背後偷看你的螢幕、公司把含有客戶資料的檔案寄錯人。注意最後一個例子，裡面沒有任何壞人，機密性照樣受損。</p>
<p><b>完整性</b>問的是「內容可不可信」。轉帳金額從 1,000 被改成 10,000、成績被偷偷改高、網站首頁被換成別的內容，都是完整性受損。完整性還包含一個容易忽略的部分：<b>就算防不住修改，至少要能發現被改過</b>。第 04、05 課會學到的雜湊和數位簽章，做的就是這件事。</p>
<p><b>可用性</b>問的是「需要的時候用不用得到」。演唱會開賣時售票網站掛掉、<dfn data-term="ransomware">勒索軟體</dfn>把檔案鎖起來、硬碟壞掉又沒有備份，都是可用性受損。攻擊者常用的一招叫 <dfn data-term="ddos">DDoS</dfn>（分散式阻斷服務）：指揮成千上萬台被控制的電腦，同時向你的網站送出請求，把它塞爆。</p>

    <p><b>為什麼：</b>不管是不是故意，只要不該看的人看得到，機密性就受損了。資安不只是在防壞人，也在防意外。</p>

<h2>正式拆解②：攻擊面與攻防不對稱</h2>
<p><b class="lead">知道要保護什麼之後，下一個問題是：從哪裡可能被攻擊？</b>答案是所有入口的總和，也就是<dfn data-term="attack-surface">攻擊面</dfn>。</p>
<p>一間房子的攻擊面，是大門、後門、每一扇窗、陽台、狗狗專用的小門，還有藏在地墊下的備用鑰匙。一個網站的攻擊面也一樣多：登入頁、每一支 API、檔案上傳功能、管理後台、你安裝的每一個第三方套件、雲端的設定，甚至每一位員工的電子信箱（有人可能被騙而點開惡意附件）。每新增一個功能，就是多開一扇門。</p>
<p>麻煩的是，攻防雙方並不對等。防守的一方必須守住<b>每一扇</b>門，攻擊的一方只需要找到<b>一扇</b>沒鎖的門。</p>

<h3>做一次：用機率算出「不對稱」有多嚴重</h3>
<p>假設一個系統有 20 個入口，每一個都做得不錯，單獨來看有 95% 的機率守得住。整個系統「全部守住」的機率是多少？</p>
<div class="calc" role="group" aria-label="計算過程">
  <div class="row"><span>1</span><span>一個入口守住：<em>0.95</em></span></div>
  <div class="row"><span>2</span><span>兩個都守住：0.95 × 0.95 = <em>0.9025</em>（約 90%）</span></div>
  <div class="row"><span>3</span><span>20 個全部守住：0.95²⁰ ≈ <em>0.358</em>（約 36%）</span></div>
  <div class="row"><span>4</span><span>所以「至少一個被突破」的機率約 <em>64%</em></span></div>
  <div class="row"><span>5</span><span>入口增加到 50 個：0.95⁵⁰ ≈ <em>0.077</em>，全部守住只剩約 8%</span></div>
</div>
<p class="note">這個算法假設每個入口被突破與否互不影響，而且攻擊者會每一個都試。真實世界沒這麼整齊，但方向是對的：入口越多，整體越難守。</p>

<div data-widget="attack-surface"></div>

<p>這個結果帶出資安工程的三個基本對策，也是這門課後面的主線：</p>
<ul>
  <li><b>減少入口</b>（縮小攻擊面）：關掉用不到的功能，移除沒在用的套件和帳號。</li>
  <li><b>每扇門後面還有第二道防線：</b>就算一扇門被突破，攻擊者也不能長驅直入。第 13 課的「縱深防禦」會詳細說明。</li>
  <li><b>能發現有人進來：</b>假設總有一天會被突破，所以要能盡早察覺。第 15 課會講偵測。</li>
</ul>

<div class="q" data-kind="check" data-qid="l01-c2">
  <div class="q-prompt"><p>你的 Vue 專案為了用其中一個小函式，裝了一個很大的套件。從「攻擊面」的角度看，這有什麼問題？</p></div>
  <div class="q-ans">
    <p><b>答案：</b>整個套件，連同它自己依賴的其他套件，都進了你的專案，每一行程式都可能成為入口。你只用到一個小函式，卻承擔了一整包的風險。</p>
    <p><b>為什麼：</b>攻擊面算的是「所有可能被碰到的東西」，不是「你有用到的東西」。第 10 課會談到套件被人動手腳時，影響可以有多大。</p>
  </div>
</div>

<h2>正式拆解③：攻擊者是誰，合法的邊界在哪</h2>
<p><b class="lead">了解對手，才知道要防到什麼程度。</b>攻擊者大致可以分成五種：</p>
<div class="scroll-x">
  <table class="tbl">
    <thead><tr><th>攻擊者類型</th><th>常見目的</th><th>手法特徵</th></tr></thead>
    <tbody>
      <tr><td>投機型網路罪犯</td><td>錢：盜帳號、勒索、詐騙</td><td>用自動化工具大量掃描，找任何沒鎖的門，不挑對象</td></tr>
      <tr><td>組織化犯罪集團</td><td>錢，而且規模更大</td><td>分工像公司：有人寫勒索程式、有人負責入侵、有人談贖金</td></tr>
      <tr><td>國家支持的攻擊者</td><td>情報、破壞、政治目的</td><td>資源多、很有耐心，目標通常是政府、關鍵基礎設施或特定產業</td></tr>
      <tr><td>內部人員</td><td>報復、金錢，或單純疏忽</td><td>本來就在門內，擁有合法的權限</td></tr>
      <tr><td>好奇的業餘者</td><td>好玩、炫技</td><td>拿網路上現成的工具亂試</td></tr>
    </tbody>
  </table>
</div>
<p>對大多數個人和中小企業來說，最常遇到的是第一種。自動化攻擊不在乎你是誰：你的帳號可以拿去詐騙你的朋友，你的伺服器可以拿去挖加密貨幣或當成攻擊別人的跳板，你的網站可以拿去散播惡意程式。</p>

<h3>合法的邊界：練習之前一定要知道的事</h3>
<p>這門課會解釋很多攻擊為什麼能成功，因為不懂攻擊，就設計不出好的防禦。但你要知道一條清楚的界線。在台灣，《中華民國刑法》第 36 章「妨害電腦使用罪」（第 358 到 363 條）規範了這類行為。第 358 條規定，無故輸入他人帳號密碼、破解保護措施或利用系統漏洞入侵他人電腦，處三年以下有期徒刑；第 359 條處罰無故取得、刪除或變更他人電腦裡的資料並造成損害，處五年以下有期徒刑。</p>
<p>請注意兩件事。第一，第 358 條的「入侵」本身就可能觸法，就算你什麼都沒拿、什麼都沒改。第二，關鍵字是「無故」，也就是沒有正當的權限。「我是好意幫他找漏洞」不等於有權限；有權限的意思是對方事先明確同意，實務上要有書面授權，並寫清楚可以測試的範圍。</p>
<aside class="co co-info">
  <div class="co-h">本課程怎麼處理攻擊示範</div>
  <p>所有攻擊示範都在這個頁面裡用模擬完成，不會連到任何真實系統。想動手練習時，只在自己的電腦、自己架設的練習環境，或有書面授權的範圍內進行。這一段是概念說明，不是法律意見。</p>
</aside>

<aside class="co co-aha" data-guess="l01-g">
  <div class="co-h">本課最重要的「啊哈」</div>
  <p>資安不是「有沒有被駭」的是非題，而是三種性質各自有沒有守住。再加上防守方要守住所有入口、攻擊方只需要一個，資安工程的核心工作就是三件事：<b>減少入口、分層防守、盡早發現異常</b>。</p>
  <p><b>開頭的問題：</b>算，而且是嚴重的資安事件。沒有資料被偷、也沒有資料被改，但醫生需要病歷時打不開，受損的是可用性。在醫院，可用性受損可能直接影響病人的安全。</p>
</aside>

<aside class="co co-warn">
  <div class="co-h">常見誤解</div>
  <p class="co-quote">「我又沒什麼值得偷的，駭客不會找上我。」</p>
  <p>這個想法很自然，因為電影裡的駭客都是挑特定目標下手。但現實中大部分的攻擊是自動化的：程式二十四小時掃描整個網際網路，找任何一扇沒鎖的門，並不在乎門後是誰。你的帳號、你的伺服器、你的網站流量，本身就有價值。</p>
  <p>下次你想說「誰會攻擊我」的時候，改問自己：「我有哪一扇門沒鎖？」</p>
</aside>

<details class="deep">
  <summary>延伸（可跳過）<small>CIA 之外的性質、法條細節</small></summary>
  <div>
    <p><b>CIA 之外還有幾個常見的性質。</b>真實性（Authenticity）：確認對方真的是他宣稱的那個人或系統。不可否認性（Non-repudiation）：做過的事事後無法否認，例如電子簽章。可歸責性（Accountability）：每個動作都能追到是誰做的。第 03 課的 STRIDE 和第 05、06 課都會用到它們。</p>
    <p><b>法條細節。</b>刑法第 361 條規定，對公務機關的電腦犯第 358 到 360 條的罪，加重其刑至二分之一；第 362 條處罰製作專門用來犯這些罪的電腦程式；第 363 條規定，第 358 到 360 條的罪須告訴乃論，也就是要被害人提告才會追訴。</p>
    <p><b>名字的由來。</b>CIA 三要素的英文是 CIA Triad，取三個英文字首，跟美國中情局沒有關係。</p>
  </div>
</details>

<p>下一課會用到本課的 CIA：評估風險時，「出事有多痛」常常就是用機密性、完整性、可用性哪一項受損來描述。</p>

<h2>本課三個重點</h2>
<ol class="keys">
  <li>資訊安全保護的是資訊的三種性質：機密性（只有該看的人看得到）、完整性（沒被偷改，改了會被發現）、可用性（需要時用得到）。</li>
  <li>攻擊面是所有可能被碰到的入口總和；入口越多，「至少有一個被突破」的機率就越高，這是防守方天生辛苦的原因。</li>
  <li>大部分攻擊是自動化、不挑對象的；在台灣，未經授權入侵他人系統本身就可能觸法，練習只能在自己擁有或有書面授權的環境。</li>
</ol>

<h2>練習</h2>
<div class="q" data-kind="practice" data-level="y" data-qid="l01-p1">
  <div class="q-prompt">
    <p class="q-title">分類與推理</p>
    <p>一個線上訂餐平台發生了三件事：</p>
    <p>（a）晚餐尖峰時段，App 一直轉圈圈打不開。<br>（b）有人把某家餐廳的菜單價格從 120 元改成 12 元。<br>（c）外送員的手機，可以看到所有顧客的完整地址和訂單紀錄，而不只是他要送的那一單。</p>
    <p>它們分別傷害了 C、I、A 的哪一項？其中哪一件最可能「一直沒人發現」？為什麼？</p>
  </div>
  <div class="q-ans">
    <p><b>答案：</b>（a）可用性；（b）完整性；（c）機密性。最可能一直沒人發現的是（c）。</p>
    <p><b>為什麼：</b>資料被看、被複製，不會留下任何缺口，原本的資料都還在；而且這不是「被駭」，是權限給太多，平常一切運作正常，沒人會覺得哪裡怪。（a）和（b）很快就會被使用者或店家注意到。</p>
    <p><b>常見卡點：</b>覺得（c）沒問題，因為外送員是「自己人」。機密性問的是「該不該看」，不是「是不是壞人」。</p>
  </div>
</div>
<div class="q" data-kind="practice" data-level="y" data-qid="l01-p2">
  <div class="q-prompt">
    <p class="q-title">攻擊面算術</p>
    <p>一個系統有 10 個對外的入口，每個入口單獨來看有 98% 的機率守得住。</p>
    <p>（1）全部守住的機率大約是多少？（2）如果關掉其中 4 個用不到的入口呢？（3）如果不關入口，改成把每個入口的防護提升到 99%，哪一種做法效果比較好？可以用上面的模擬器幫忙算。</p>
  </div>
  <div class="q-ans">
    <p><b>答案：</b>（1）0.98¹⁰ ≈ 81.7%。（2）0.98⁶ ≈ 88.6%。（3）每個入口提升到 99%：0.99¹⁰ ≈ 90.4%，效果比關掉 4 個入口略好。兩個一起做：0.99⁶ ≈ 94.1%，最好。</p>
    <p><b>為什麼：</b>兩種做法都有效，一個減少入口數量、一個讓每個入口更堅固。實務上「關掉用不到的入口」通常便宜很多，改一行設定就好；「每個入口都加強」往往要花更多工夫。所以常見的順序是先縮小攻擊面，再加強剩下的入口。</p>
  </div>
</div>
<div class="q" data-kind="practice" data-level="r" data-qid="l01-p3">
  <div class="q-prompt">
    <p class="q-title">說服一位朋友</p>
    <p>朋友說：「我架了一個個人部落格，上面只有旅遊照片，沒什麼機密，所以不用管資安。」請用本課的 CIA 和「自動化攻擊」概念，列出至少三個他其實該在意的風險，並說明每一個對應哪一項性質。</p>
  </div>
  <div class="q-hint"><p>不要只想「照片被偷」。想想看：網站內容被改掉會怎樣？網站被拿去做別的事呢？如果某天整個打不開，照片還在嗎？照片本身有沒有藏著什麼資訊？</p></div>
  <div class="q-ans">
    <p><b>好答案會包含：</b></p>
    <ul>
      <li><b>完整性：</b>網站被植入詐騙連結或惡意程式，來看的朋友受害，他的名聲也跟著受損。</li>
      <li><b>可用性：</b>網站被塞爆或被刪除；照片如果沒有另外備份，就全部沒了。</li>
      <li><b>機密性：</b>後台密碼如果跟其他服務共用，一外洩，其他帳號也會被登入；照片裡的拍攝位置資訊（EXIF）可能透露住家附近在哪裡。</li>
      <li><b>自動化攻擊不挑人：</b>主機可能被拿去挖加密貨幣，或當成攻擊別人的跳板。</li>
    </ul>
    <p><b>參考寫法：</b>「沒有機密不代表沒有風險。你的網站可能被改成詐騙頁面去騙你朋友（完整性），可能某天被刪掉而照片沒備份（可用性），照片還可能藏著你家的位置（機密性）。而且攻擊程式是自動掃描的，不會因為你只是個人部落格就跳過。」你的說法不必一樣。</p>
  </div>
</div>

<h2>心智模型：颱風天的腦內算術</h2>
<p>你在那一晚做的事，其實是一道算術：<b>這件事發生的機會有多大，乘上發生了會有多慘</b>。資安領域把這道算術拆成幾個零件：</p>
<div class="scroll-x">
  <table class="tbl">
    <thead><tr><th>颱風天</th><th>資安的說法</th><th>白話意思</th></tr></thead>
    <tbody>
      <tr><td>車子、盆栽、窗戶</td><td>資產<span class="en">Asset</span></td><td>值得保護的東西</td></tr>

      <tr><td>氣象局說的降雨機率</td><td>可能性<span class="en">Likelihood</span></td><td>發生的機會有多大</td></tr>
      <tr><td>泡水車的修理費</td><td>衝擊<span class="en">Impact</span></td><td>發生了會有多痛</td></tr>
      <tr><td>買保險</td><td>風險轉移<span class="en">Risk Transfer</span></td><td>讓別人分擔後果</td></tr>
    </tbody>
  </table>
</div>
<p class="swipe-hint">← 表格可以左右滑動 →</p>
<p class="limit"><b>比喻的極限</b>颱風不會學習，也不會專門針對你家。資安的威脅常常是會思考的對手：你補了一個洞，他就去找下一個；你越有價值，他越願意花力氣。所以資安的「可能性」會隨著你的防護而改變，不像天氣有固定的機率。另外，颱風有幾十年的氣象資料可以參考，資安事件的機率常常只能靠經驗估計。</p>

    <div><dt>風險<span class="en">Risk</span></dt><dd>威脅利用弱點、對資產造成衝擊的「可能性」和「後果」的組合。</dd></div>

</aside>

<h2>正式拆解①：風險的四個零件</h2>
<p><b class="lead">「這個很危險」這種說法沒辦法比較、也沒辦法排順序，所以要先把風險拆開。</b>一個完整的風險，一定是一條鏈：</p>
<div class="chain" role="img" aria-label="威脅利用弱點，傷害資產，產生衝擊">
  <div class="node"><small>THREAT</small><b>威脅</b><span>想拿個資去賣的攻擊者</span></div>
  <div class="arr">利用</div>
  <div class="node"><small>VULNERABILITY</small><b>弱點</b><span>API 沒檢查身分就回傳資料</span></div>
  <div class="arr">傷害</div>
  <div class="node"><small>ASSET</small><b>資產</b><span>會員資料庫</span></div>
  <div class="arr">產生</div>
  <div class="node"><small>IMPACT</small><b>衝擊</b><span>個資外洩、罰款、失去信任</span></div>
</div>
<p>這條鏈最重要的性質是：<b>少一個零件，就不構成風險</b>。沒有弱點，威脅無從下手；沒有資產，就沒什麼好損失的。這也告訴你防護可以從哪裡著手：你通常沒辦法消滅威脅（世界上永遠有攻擊者），但你可以修補弱點、減少資產（不收集用不到的資料），或降低衝擊。</p>
<p>描述衝擊的時候，可以直接用上一課學到的語言。<button type="button" class="xref" data-lesson="01">回顧第 01 課：CIA 三要素</button> 這個會員資料外洩的衝擊，主要是機密性受損；如果攻擊者還把資料刪了，可用性也受損。</p>

<div class="q" data-kind="check" data-qid="l02-c1">
  <div class="q-prompt"><p>「駭客」是威脅還是弱點？「好幾年沒更新的 WordPress 外掛」呢？</p></div>
  <div class="q-ans">
    <p><b>答案：</b>駭客是威脅；沒更新的外掛是弱點。</p>
    <p><b>分辨方法：</b>威脅問的是「誰或什麼會來」，弱點問的是「我哪裡有洞」。你沒辦法讓世界上的駭客消失，但你可以更新外掛。</p>
  </div>
</div>

<h2>正式拆解②：可能性 × 衝擊，放進風險矩陣</h2>
<p><b class="lead">拆好零件之後，要給每個風險一個可以比較的分數。</b>最常見的做法是替「可能性」和「衝擊」各打 1 到 5 分，再相乘。先把每一分的意思講好，大家才不會各打各的：</p>
<div class="scroll-x">
  <table class="tbl">
    <thead><tr><th>分數</th><th>可能性</th><th>衝擊</th></tr></thead>
    <tbody>
      <tr><td class="letter">1</td><td>幾乎不會發生（好幾年都不一定一次）</td><td>輕微：幾乎沒人注意到</td></tr>
      <tr><td class="letter">2</td><td>不太可能（每年一次左右）</td><td>小：少數人受影響，很快修好</td></tr>
      <tr><td class="letter">3</td><td>可能（每季一次左右）</td><td>中等：客戶抱怨、要花幾天處理</td></tr>
      <tr><td class="letter">4</td><td>很可能（每月一次左右）</td><td>重大：大量個資外洩、服務停擺一整天</td></tr>
      <tr><td class="letter">5</td><td>幾乎確定（每週或更頻繁）</td><td>災難：公司可能倒閉，或有人受傷</td></tr>
    </tbody>
  </table>
</div>
<p>分數相乘後落在 1 到 25 之間，常見的分級是：1–4 為<b>低</b>、5–9 為<b>中</b>、10–16 為<b>高</b>、20–25 為<b>嚴重</b>。每個組織的切法可以不同，重點是事先講好。</p>

<h3>做一次：替會員系統的四個風險排順序</h3>
<div class="scroll-x">
  <table class="tbl">
    <thead><tr><th>編號</th><th>風險</th><th>可能性</th><th>衝擊</th><th>分數</th><th>等級</th></tr></thead>
    <tbody>
      <tr><td>R1</td><td>登入頁被程式自動化大量猜密碼</td><td>4</td><td>3</td><td><b>12</b></td><td>高</td></tr>
      <tr><td>R2</td><td>雲端機房整個區域停電</td><td>1</td><td>4</td><td><b>4</b></td><td>低</td></tr>
      <tr><td>R3</td><td>資料庫密碼被 commit 到公開的 GitHub</td><td>3</td><td>5</td><td><b>15</b></td><td>高</td></tr>
      <tr><td>R4</td><td>客服信箱每天收到大量垃圾廣告信</td><td>5</td><td>1</td><td><b>5</b></td><td>中</td></tr>
    </tbody>
  </table>
</div>
<p class="swipe-hint">← 表格可以左右滑動 →</p>
<p>依分數排序是 R3（15）→ R1（12）→ R4（5）→ R2（4）。但要注意兩件事。第一，分數是用來<b>排序和溝通</b>的，不是精確的數字：3×4 和 4×3 都是 12，意思卻不一樣，一個是「偶爾發生但很痛」，一個是「常常發生但沒那麼痛」。第二，R2 分數最低，但衝擊有 4 分；只要它一發生，公司就要停擺一整天。<b>衝擊很高的風險，就算分數不高，也要另外看一眼。</b></p>

<div data-widget="risk-matrix"></div>

<div class="q" data-kind="check" data-qid="l02-c2">
  <div class="q-prompt"><p>在上面的矩陣裡，替 R1 勾選「啟用多因素驗證」。它的分數從多少變成多少？為什麼這個對策只動到「可能性」，沒動到「衝擊」？</p></div>
  <div class="q-ans">
    <p><b>答案：</b>從 4×3＝12（高）變成 2×3＝6（中）。</p>
    <p><b>為什麼：</b>多因素驗證讓攻擊者就算猜中密碼也登入不了，所以「成功」的機會大幅下降。但如果攻擊者真的用別的方法登入成功，造成的傷害還是一樣大，所以衝擊不變。對策要想清楚自己降的是哪一個。</p>
  </div>
</div>

<h2>正式拆解③：四種處理方式與殘餘風險</h2>
<p><b class="lead">排好順序之後，每個風險都要決定「怎麼辦」。</b>選項只有四種：</p>
<div class="scroll-x">
  <table class="tbl">
    <thead><tr><th>處理方式</th><th>颱風天的做法</th><th>資安的例子</th></tr></thead>
    <tbody>
      <tr><td><b>避免</b><span class="en">Avoid</span></td><td>颱風天乾脆不出門</td><td>不收集用不到的個資。沒有資料，就不會外洩。</td></tr>
      <tr><td><b>降低</b><span class="en">Mitigate</span></td><td>把車開到高處</td><td>加上多因素驗證、限制登入嘗試次數，降低可能性或衝擊。</td></tr>
      <tr><td><b>轉移</b><span class="en">Transfer</span></td><td>買保險</td><td>買資安保險；把刷卡交給專業的金流服務商處理。</td></tr>
      <tr><td><b>接受</b><span class="en">Accept</span></td><td>窗戶裂縫貼個膠帶就好</td><td>內部測試工具偶爾當機、不影響客戶，評估後決定不處理。</td></tr>
    </tbody>
  </table>
</div>
<p class="swipe-hint">← 表格可以左右滑動 →</p>
<p>「轉移」有個容易誤會的地方：你可以把<b>財務損失</b>轉給保險公司、把<b>技術工作</b>交給服務商，但<b>客戶對你的信任轉不走</b>。資料在合作廠商那裡外洩，客戶記得的還是你的名字。</p>
<p>「接受」也不等於「沒注意到」。接受必須是一個有意識的決定：有人評估過、有人負責簽名、有寫下來。這兩者的差別，在出事之後會非常明顯。</p>
<p>最後，不管做了多少防護，永遠會剩下一些風險，這叫<dfn data-term="residual-risk">殘餘風險</dfn>。目標不是讓它變成零，而是讓它低於組織願意承受的程度，並且清楚知道剩下的是什麼。</p>

<div class="q" data-kind="check" data-qid="l02-c3">
  <div class="q-prompt"><p>公司決定把網站的付款功能改用第三方金流服務，自己不再保存任何信用卡號碼。這屬於四種處理方式的哪一種？可能不只一種。</p></div>
  <div class="q-ans">
    <p><b>答案：</b>主要是「避免」加上「轉移」。</p>
    <p><b>為什麼：</b>卡號這項資產從你的系統裡消失了，自己保存卡號的風險就被避免掉；處理卡號的工作交給專業服務商，是轉移。但殘餘風險還在，例如網站被竄改，把使用者導向假的付款頁面。</p>
  </div>
</div>

<aside class="co co-aha" data-guess="l02-g">
  <div class="co-h">本課最重要的「啊哈」</div>
  <p>「可能性 × 衝擊」把資安從一團模糊的恐懼，變成一張<b>可以排序、可以討論、可以分配預算</b>的清單。資安工作就是從清單最上面開始，一項一項選擇處理方式。</p>
  <p><b>開頭的問題：</b>要看情況，但「很少發生、一發生就倒閉」的風險，不能因為分數不高就放著不管。它發生一次就沒有下一次，所以至少要有降低衝擊的對策，例如備份、保險、應變計畫。「常發生但損失小」的風險，則常常用便宜的自動化方法處理，或直接接受。</p>
</aside>

<aside class="co co-warn">
  <div class="co-h">常見誤解</div>
  <p class="co-quote">「資安做得好，就是把風險降到零。」</p>
  <p>聽起來很合理，因為我們希望「安全」是絕對的。但只要系統還連著網路、還有人在用，風險就不會是零。追求零風險會讓成本無限增加，最後只剩下「把伺服器的網路線拔掉」這種做法，系統也就沒有用了。</p>
  <p>正確的目標是把風險降到組織可以接受的程度，並清楚知道剩下的風險是什麼。下次你想說「這樣就安全了」，改問：「剩下的風險是什麼？誰同意接受它？」</p>
</aside>

<details class="deep">
  <summary>延伸（可跳過）<small>用金額算風險：年化損失期望值</small></summary>
  <div>
    <p>上面的 1–5 分叫<b>定性評估</b>，快速、好溝通。另一種做法是<b>定量評估</b>，直接用金額算：</p>
    <div class="calc">
      <div class="row"><span>1</span><span>單次損失（SLE）× 每年發生次數（ARO）＝ 年化損失期望值（ALE）</span></div>
      <div class="row"><span>2</span><span>公司每年平均遺失 2 台筆電，每次含資料外洩處理損失 30 萬 → ALE ＝ <em>60 萬／年</em></span></div>
      <div class="row"><span>3</span><span>全面啟用硬碟加密，每年成本 10 萬；遺失後資料讀不出來，每次只損失硬體 3 萬 → ALE ＝ <em>6 萬／年</em></span></div>
      <div class="row"><span>4</span><span>每年少損失 54 萬，成本 10 萬 → <em>值得做</em></span></div>
    </div>
    <p>定量評估的難處在於，很多數字只能估計。實務上常先用定性評估排出順序，再對最重要的幾項算金額，拿去跟主管談預算。國際上常參考的風險評估指引有 ISO/IEC 27005 和 NIST SP 800-30。</p>
  </div>
</details>

<p>下一課會把這一課的清單變得更完整：與其靠靈感想「可能會出什麼事」，不如用一套固定的方法，把系統的每個角落都檢查一遍。</p>

<h2>本課三個重點</h2>
<ol class="keys">
  <li>風險由四個零件組成：資產（要保護什麼）、威脅（誰或什麼會來）、弱點（哪裡有洞）、衝擊（出事有多痛），少一個就不構成風險。</li>
  <li>用「可能性 × 衝擊」把風險放進矩陣，可以排出處理順序；但災難級衝擊的風險即使機率低，也一定要有對策。</li>
  <li>每個風險都要選一種處理方式：避免、降低、轉移或接受；殘餘風險永遠存在，接受它必須是有人負責的明確決定。</li>
</ol>

<h2>練習</h2>
<div class="q" data-kind="practice" data-level="y" data-qid="l02-p1">
  <div class="q-prompt">
    <p class="q-title">拆零件</p>
    <p>小美的公司用一個共用 Excel 檔，記錄所有客戶的姓名、電話和購買紀錄。檔案放在任何員工都打得開的共用資料夾；上個月才有一位員工離職，他的帳號還沒停用。</p>
    <p>請找出：資產、至少兩個威脅、至少兩個弱點，以及可能的衝擊（用 CIA 說明）。</p>
  </div>
  <div class="q-ans">
    <p><b>資產：</b>客戶資料 Excel，還有公司的商譽。</p>
    <p><b>威脅：</b>離職員工、拿到任何一位員工帳號的外部攻擊者、員工誤刪或誤傳檔案。</p>
    <p><b>弱點：</b>權限太寬（所有員工都能打開）、離職帳號沒停用、看不出誰打開過檔案、只有一份檔案（可能沒有備份）。</p>
    <p><b>衝擊：</b>機密性（客戶個資外洩，可能要依法通知客戶）、完整性（資料被改掉，例如聯絡電話被竄改）、可用性（檔案被刪又沒備份）。</p>
    <p><b>常見卡點：</b>把「離職員工」寫成弱點。他是威脅；「離職帳號沒停用」才是弱點。</p>
  </div>
</div>
<div class="q" data-kind="practice" data-level="y" data-qid="l02-p2">
  <div class="q-prompt">
    <p class="q-title">排順序並選處理方式</p>
    <p>計算下面四個風險的分數、排出處理順序，並替每一個選一種處理方式：</p>
    <p>（a）官網偶爾被搜尋引擎的爬蟲拖慢：可能性 4、衝擊 1。<br>（b）資料庫備份從來沒測試過能不能還原，如果遇到勒索軟體：可能性 2、衝擊 5。<br>（c）五位員工共用同一組管理員帳號密碼：可能性 3、衝擊 4。<br>（d）系統依賴的一個套件已經停止維護：可能性 3、衝擊 3。</p>
  </div>
  <div class="q-ans">
    <p><b>答案：</b>（c）12 → （b）10 → （d）9 → （a）4。</p>
    <p><b>處理方式：</b>（c）降低：每個人一組帳號，加上多因素驗證。（b）降低：定期做還原演練，確認備份真的能用。（d）降低或避免：換成有人維護的套件，或拿掉用到它的功能。（a）接受，或用很便宜的方式降低，例如限制爬蟲的抓取頻率。</p>
    <p><b>常見卡點：</b>看到（b）的可能性只有 2 就排到後面。它的衝擊是 5，而且修正成本很低，只要實際還原一次看看。災難級衝擊要特別看待。</p>
  </div>
</div>
<div class="q" data-kind="practice" data-level="r" data-qid="l02-p3">
  <div class="q-prompt">
    <p class="q-title">說服產品經理</p>
    <p>你的 Vue 會員系統要在會員生日當月發優惠券。產品經理想存「完整的出生年月日」，你認為只存「月份」就夠了。請寫一段 100 到 150 字的說明說服他，至少用到本課的兩個名詞。</p>
  </div>
  <div class="q-hint"><p>四種處理方式裡，哪一種最便宜、也最徹底？再想想：完整的生日跟其他資料放在一起，可以被拿來做什麼？很多網站的「忘記密碼」問題、很多人的密碼，都跟生日有關。</p></div>
  <div class="q-ans">
    <p><b>好答案會包含：</b>①「避免」是最徹底的處理方式，沒存的資料就不會外洩。②完整生日是高價值的資產，常被拿來驗證身分或猜密碼，外洩的衝擊比只有月份大得多。③業務需求只需要月份，多存沒有好處，只增加風險。④可以補充：第 17 課會談到個資法「蒐集要跟目的相關」的精神。</p>
    <p><b>參考寫法：</b>「發生日券只需要知道月份。完整生日是高價值的資產，常被拿來驗證身分、猜密碼，一旦外洩，衝擊比月份大很多。與其存了之後再花錢加密、監控，不如直接用『避免』處理：只存月份，這項風險就從系統裡消失了。」你的說法不必一樣。</p>
  </div>
</div>

<h2>心智模型：把平面圖換成系統圖</h2>
<p>搶匪桌上那張平面圖，在資安裡叫<dfn data-term="dfd">資料流程圖</dfn>；他們圍著圖提問的過程，叫<dfn data-term="threat-modeling">威脅建模</dfn>。每個部分都能對應：</p>
<div class="scroll-x">
  <table class="tbl">

<p class="limit"><b>比喻的極限</b>搶匪只需要成功一次，你卻要在設計階段就盡量想周全。而且軟體系統的「建築」會一直改建，每次更新都可能多開一扇門，所以威脅建模不是做一次就結束，系統有重大改變就要更新。另外，實體銀行一次只能被一組人從一個地方闖入，網路攻擊可以同時從全世界試。</p>

<aside class="co co-terms">
  <div class="co-h">本課新名詞</div>
  <dl class="terms">
    <div><dt>威脅建模<span class="en">Threat Modeling</span></dt><dd>在設計階段有系統地找出可能出錯的地方，並決定對策的方法。</dd></div>
    <div><dt>資料流程圖<span class="en">DFD</span></dt><dd>用四種符號畫出資料從哪裡來、經過誰處理、存到哪裡。</dd></div>
    <div><dt>信任邊界<span class="en">Trust Boundary</span></dt><dd>資料從一個信任等級進入另一個信任等級的交界線。</dd></div>
    <div><dt>STRIDE</dt><dd>六種威脅類型的英文字首，用來當作不容易漏掉的檢查清單。</dd></div>
    <div><dt>對策<span class="en">Mitigation</span></dt><dd>針對某個威脅採取的防護措施。</dd></div>
  </dl>
</aside>

<h2>正式拆解①：四個問題與資料流程圖</h2>
<p><b class="lead">靠腦力激盪想「駭客會怎麼攻擊」，很容易漏東西，而且有經驗的人想得到、新手想不到。所以需要一套固定的方法。</b>資安專家 Adam Shostack 把威脅建模整理成四個問題：</p>
<ol>
  <li><b>我們在做什麼？</b>畫出資料流程圖。</li>
  <li><b>可能出什麼錯？</b>用 STRIDE 逐一檢查。</li>
  <li><b>我們要怎麼處理？</b>決定對策，也就是第 02 課的四種處理方式。</li>
  <li><b>我們做得夠好嗎？</b>回頭檢查，系統改變時更新。</li>
</ol>
<p>第一步的資料流程圖只有四種符號，再加上一條紅色虛線：</p>
<ul>
  <li><b>外部實體</b>（方框）：你控制不了的人或系統，例如使用者、第三方服務。</li>
  <li><b>處理程序</b>（圓形）：會對資料做事情的程式，例如前端、API 伺服器。</li>
  <li><b>資料儲存</b>（上下兩條線）：資料放著的地方，例如資料庫、檔案、快取。</li>
  <li><b>資料流</b>（箭頭）：資料的移動方向。</li>
  <li><b>信任邊界</b>（紅色虛線）：資料從一個信任等級，進入另一個信任等級的地方。</li>
</ul>
<p>畫信任邊界時，有一個對前端工程師特別重要的觀念：<b>Vue 前端程式雖然是你寫的，但它下載到使用者的電腦、在使用者的瀏覽器裡執行</b>，所以它位在信任邊界的外側。使用者可以打開瀏覽器的開發者工具，修改任何東西，甚至完全不用你的前端，直接用別的工具呼叫你的 API。</p>

<div class="q" data-kind="check" data-qid="l03-c1">
  <div class="q-prompt"><p>如果使用者可以完全不經過你的前端、直接呼叫 API，那麼前端寫的表單驗證（例如「Email 格式不對就不能送出」）還有沒有存在的意義？</p></div>
  <div class="q-ans">
    <p><b>答案：</b>有，但它的意義是使用者體驗，不是安全。</p>
    <p><b>為什麼：</b>前端驗證讓一般使用者即時知道哪裡填錯，不用等伺服器回應。但它擋不住刻意繞過的人，所以伺服器一定要再檢查一次。兩邊都做，各自負責不同的事。</p>
  </div>
</div>

<h2>正式拆解②：STRIDE 六個問題</h2>
<p><b class="lead">圖畫好了，接下來要問什麼？STRIDE 把常見的威脅分成六類，每一類剛好對應一個想保護的性質。</b>你會看到第 01 課的 CIA，以及延伸裡提到的真實性、不可否認性。<button type="button" class="xref" data-lesson="01">回顧第 01 課：CIA 三要素</button></p>
<div class="scroll-x">
  <table class="tbl" style="min-width:760px">
    <thead><tr><th>字母</th><th>威脅類型</th><th>白話</th><th>違反的性質</th><th>會員系統的例子</th><th>典型對策</th></tr></thead>
    <tbody>
      <tr><td class="letter">S</td><td>冒充<span class="en">Spoofing</span></td><td>假裝成別人</td><td>真實性</td><td>用偷來的密碼登入別人的帳號</td><td>強驗證、多因素驗證（第 06 課）</td></tr>
      <tr><td class="letter">T</td><td>竄改<span class="en">Tampering</span></td><td>偷改資料</td><td>完整性</td><td>修改請求裡的價格欄位</td><td>伺服器端檢查、數位簽章（第 05 課）</td></tr>
      <tr><td class="letter">R</td><td>否認<span class="en">Repudiation</span></td><td>做了卻不承認，而且查無證據</td><td>不可否認性</td><td>「那筆訂單不是我下的」，但沒有紀錄可查</td><td>日誌、稽核紀錄（第 15 課）</td></tr>
      <tr><td class="letter">I</td><td>資訊洩露<span class="en">Information Disclosure</span></td><td>看到不該看的</td><td>機密性</td><td>API 回傳多餘欄位，包含密碼雜湊</td><td>只回傳需要的欄位、加密、存取控制</td></tr>
      <tr><td class="letter">D</td><td>阻斷服務<span class="en">Denial of Service</span></td><td>讓服務用不了</td><td>可用性</td><td>大量請求塞爆登入 API</td><td>限流、擴充容量</td></tr>
      <tr><td class="letter">E</td><td>權限提升<span class="en">Elevation of Privilege</span></td><td>拿到本來沒有的權限</td><td>授權</td><td>一般會員把自己改成管理員</td><td>伺服器端權限檢查（第 07 課）</td></tr>
    </tbody>
  </table>
</div>
<p class="swipe-hint">← 表格可以左右滑動 →</p>
<p>不是每個元件都要問滿六個問題。一個好用的經驗法則是依元件種類來問：</p>
<ul>
  <li><b>外部實體：</b>問 S、R（有人冒充它嗎？它會否認做過的事嗎？）</li>
  <li><b>處理程序：</b>六類都要問。</li>
  <li><b>資料儲存：</b>問 T、I、D；如果存的是紀錄，也要問 R。</li>
  <li><b>資料流：</b>問 T、I、D（途中被改？被偷看？被塞爆？）</li>
</ul>

<div class="q" data-kind="check" data-qid="l03-c2">
  <div class="q-prompt"><p>使用者在開發者工具裡，把送出的訂單金額從 1,000 改成 1，伺服器照單全收。這屬於 STRIDE 的哪一類？伺服器應該怎麼做？</p></div>
  <div class="q-ans">
    <p><b>答案：</b>T，竄改。</p>
    <p><b>怎麼做：</b>伺服器不要採用前端送來的價格，而是依照商品編號，自己從資料庫查出價格來計算。從信任邊界外進來的資料，只能當作「請求」，不能當作「事實」。</p>
  </div>
</div>

<h2>正式拆解③：從威脅到對策清單</h2>
<p><b class="lead">把前兩段合起來，就是一次完整的威脅建模。</b>下面是一個會員系統的資料流程圖。點每個元件和箭頭，看它適用哪幾類 STRIDE、各有什麼對策。特別注意跨越紅色虛線的那幾條資料流。</p>

<div data-widget="dfd-stride"></div>

<p>威脅建模最後產出的，是一張可以追蹤的清單。每個威脅都用第 02 課的方法打分數，再決定處理方式和負責人。<button type="button" class="xref" data-lesson="02">回顧第 02 課：可能性 × 衝擊</button></p>

    <thead><tr><th>威脅</th><th>STRIDE</th><th>分數</th><th>處理方式與對策</th><th>負責人</th><th>狀態</th></tr></thead>
    <tbody>
      <tr><td>訂單請求裡的價格被竄改</td><td>T</td><td>4×4＝16</td><td>降低：伺服器依商品編號自己查價格</td><td>後端</td><td>本週修</td></tr>
      <tr><td>一般會員呼叫管理員 API</td><td>E</td><td>3×5＝15</td><td>降低：每支 API 檢查角色</td><td>後端</td><td>本週修</td></tr>
      <tr><td>登入 API 被大量請求塞爆</td><td>D</td><td>3×3＝9</td><td>降低：同一來源限流</td><td>維運</td><td>下個月</td></tr>
    </tbody>
  </table>
</div>
<p class="swipe-hint">← 表格可以左右滑動 →</p>
<p>什麼時候該做威脅建模？設計新功能時、架構大改時，以及發生資安事件之後。一個小功能在白板前花 30 分鐘就夠了，而且最好是開發者自己參與，因為最了解系統怎麼運作的就是寫它的人。一份不完美的威脅模型，遠勝過沒有。</p>

<aside class="co co-aha" data-guess="l03-g">
  <div class="co-h">本課最重要的「啊哈」</div>
  <p>威脅最容易發生在<b>信任邊界</b>上，也就是資料從「不可信」的地方進入「可信」的地方的那一瞬間。所以威脅建模最有效率的做法是：先畫圖、標出信任邊界，再用 STRIDE 對每一條跨越邊界的資料流逐一提問。</p>
  <p><b>開頭的問題：</b>交界處。金庫本身通常最堅固，真正的破口在「運鈔車卸貨」「員工進出」這種兩個區域交接、需要互相信任的地方。系統也一樣，瀏覽器送到 API 的每一個請求，都是這種交接點。</p>
</aside>

<aside class="co co-warn">
  <div class="co-h">常見誤解</div>
  <p class="co-quote">「前端已經檢查過了，後端就不用再檢查。」</p>
  <p>寫前端的人特別容易這樣想，因為你寫的表單驗證在畫面上確實擋住了錯誤的輸入。但前端在信任邊界之外：攻擊者可以關掉 JavaScript、在開發者工具裡改資料，或用 curl、Postman 這類工具直接呼叫你的 API，完全繞過前端。</p>
  <p>檢查自己的方法：每寫一個前端驗證，就問一句「後端有沒有做同一件事」。</p>
</aside>

<details class="deep">
  <summary>延伸（可跳過）<small>其他威脅建模方法與工具</small></summary>
  <div>
    <p><b>攻擊樹（Attack Tree）：</b>把攻擊者的目標寫在樹根，例如「拿到管理員權限」，往下展開所有可能的達成方式，適合分析單一個重要目標。</p>
    <p><b>LINDDUN：</b>專門找隱私威脅的方法，會問「資料能不能被連結到特定的人」這類 STRIDE 沒涵蓋的問題。</p>
    <p><b>工具：</b>OWASP Threat Dragon 是免費的繪圖工具，可以畫資料流程圖並記錄威脅；微軟的 Threat Modeling Tool 也能依元件自動列出 STRIDE 威脅。微軟另外出過一套叫 Elevation of Privilege 的卡牌遊戲，讓開發團隊用打牌的方式做威脅建模。</p>
  </div>
</details>

<h2>本課三個重點</h2>
<ol class="keys">
  <li>威脅建模用四個問題進行：我們在做什麼、可能出什麼錯、要怎麼處理、做得夠不夠好。先畫資料流程圖，再逐一提問。</li>
  <li>STRIDE 把威脅分成冒充、竄改、否認、資訊洩露、阻斷服務、權限提升六類，每一類對應一個要保護的性質，是不容易漏掉的檢查清單。</li>
  <li>前端程式在信任邊界之外執行，所有跨越邊界進來的資料都要在伺服器端重新驗證；前端驗證只負責使用者體驗。</li>
</ol>

<h2>練習</h2>
<div class="q" data-kind="practice" data-level="y" data-qid="l03-p1">
  <div class="q-prompt">
    <p class="q-title">替情境貼上 STRIDE 標籤</p>
    <p>下面五個情境，各屬於 STRIDE 的哪一類？</p>
    <p>（1）有人用 Postman 直接呼叫 <code>/api/users/42</code>，拿到了別人的電話和地址。<br>（2）某個來源一秒送出 5,000 次搜尋請求，網站變得非常慢。<br>（3）攻擊者寄信假冒執行長，要求財務人員匯款。<br>（4）使用者把請求裡的 <code>"role": "member"</code> 改成 <code>"admin"</code>，就進得了後台。<br>（5）系統沒有記錄誰刪了訂單，事後沒人能證明是誰做的。</p>
  </div>
  <div class="q-ans">
    <p><b>答案：</b>（1）I 資訊洩露；（2）D 阻斷服務；（3）S 冒充；（4）E 權限提升；（5）R 否認。</p>
    <p><b>為什麼：</b>分類時看的是這個威脅<b>最後造成什麼傷害</b>。</p>
    <p><b>常見卡點：</b>（4）容易答成 T。修改請求本身確實是竄改，但這個威脅的目的和結果是拿到不該有的權限，所以歸在 E。同一件事牽涉兩類很正常，兩個都寫出來也算對，重點是知道要防的是什麼。</p>
  </div>
</div>
<div class="q" data-kind="practice" data-level="y" data-qid="l03-p2">
  <div class="q-prompt">
    <p class="q-title">找出信任邊界</p>
    <p>一款 Unity 手機遊戲的架構是這樣的：玩家手機上的遊戲 → 遊戲伺服器（負責接收分數上傳）→ 排行榜資料庫；遊戲伺服器另外會呼叫第三方廣告服務的回報 API。</p>
    <p>這裡至少有幾條信任邊界？分別在哪裡？哪一條資料流最需要優先做威脅建模？為什麼？</p>
  </div>
  <div class="q-ans">
    <p><b>答案：</b>至少三條：①玩家手機和遊戲伺服器之間；②遊戲伺服器和資料庫之間；③遊戲伺服器和第三方廣告服務之間。最優先的是①的分數上傳。</p>
    <p><b>為什麼：</b>玩家完全掌控手機上的遊戲程式，可以修改記憶體裡的數值、修改送出去的封包，把分數改成 999999（T 竄改），或冒用別人的身分上傳（S 冒充）。排行榜被灌假分數，是線上遊戲最常見的作弊。這跟前端完全一樣：手機上的遊戲程式在信任邊界外，伺服器要自己判斷分數合不合理。第 07 課會再談「永遠不要相信客戶端」。</p>
  </div>
</div>
<div class="q" data-kind="practice" data-level="r" data-qid="l03-p3">
  <div class="q-prompt">
    <p class="q-title">替「忘記密碼」做迷你威脅模型</p>
    <p>流程是：使用者輸入 email → 系統寄出重設密碼的連結 → 使用者點連結、設定新密碼。</p>
    <p>請（1）列出流程中的元件和資料流；（2）找出至少四個威脅，涵蓋至少三種不同的 STRIDE 字母；（3）替每個威脅寫一個對策。</p>
  </div>
  <div class="q-hint"><p>想想這幾個情況：重設連結被別人拿到會怎樣？攻擊者輸入別人的 email 會怎樣？網站回應「這個 email 沒有註冊」會透露什麼？有人一直按「寄送」呢？連結網址裡如果帶著使用者編號呢？</p></div>
  <div class="q-ans">
    <p><b>元件與資料流：</b>使用者、前端、API、使用者資料庫、寄信服務、使用者的信箱；資料流包括 email 送到 API、API 查資料庫、API 請寄信服務寄信、使用者點連結把新密碼送回 API。</p>
    <p><b>威脅與對策（好答案會包含其中四個以上）：</b></p>
    <ul>
      <li><b>S 冒充：</b>拿到重設連結的人就能冒充使用者。→ 連結裡放夠長的隨機代碼，只能用一次，15 到 60 分鐘後失效。</li>
      <li><b>I 資訊洩露：</b>回應「這個 email 沒有註冊」，等於讓攻擊者確認誰是會員。→ 不管 email 存不存在，都回同一句話，例如「如果這個 email 有註冊，你會收到信」。</li>
      <li><b>D 阻斷服務：</b>大量觸發寄信，塞爆使用者的信箱或燒光寄信額度。→ 對同一個 email 和同一個來源限流。</li>
      <li><b>T 竄改：</b>把網址裡的 <code>userId=42</code> 改成 43，重設別人的密碼。→ 代碼對應哪個使用者，由伺服器自己記錄，不相信網址裡的使用者編號。</li>
      <li><b>R 否認：</b>密碼被重設了，卻查不到是什麼時候、從哪裡發起的。→ 記錄每次重設，並寄信通知使用者「你的密碼剛剛被重設」。</li>
    </ul>
  </div>
</div>

<h2>生活情境：寄一個上鎖的箱子給陌生人</h2>
<div class="story">
  <p>小安要把一份機密合約寄給另一個城市的合作夥伴阿哲，兩人從沒見過面。她把合約放進鐵箱、上鎖，然後卡住了：鑰匙怎麼給阿哲？把鑰匙一起寄過去，郵差就同時拿到箱子和鑰匙；另外找人送鑰匙，那個人也可能偷打一把。</p>
  <p>阿哲想到一個辦法。他去買了一把掛鎖，鑰匙留在自己身上，只把「打開的掛鎖」寄給小安。小安用這把鎖把箱子扣上，寄回給阿哲。一路上郵差只看過兩樣東西：一把打開的鎖，和一個鎖好的箱子。拿到打開的鎖沒有用，因為鎖只能扣上，打不開。</p>
</div>
<div class="q" data-kind="guess" data-qid="l04-g">
  <div class="q-prompt"><p>兩個從沒見過面的人，如果他們之間的每一句話都被別人聽見，還有沒有辦法約定出一個只有他們兩人知道的密碼？</p></div>
</div>

<h2>心智模型：鎖、鑰匙和指紋</h2>
<p>密碼學（Cryptography）就是用數學做出這些鎖和鑰匙。對應關係是這樣：</p>
<div class="scroll-x">
  <table class="tbl">
    <thead><tr><th>生活裡的東西</th><th>密碼學的說法</th><th>它做到的事</th></tr></thead>
    <tbody>
      <tr><td>把合約鎖進箱子</td><td>加密<span class="en">Encryption</span></td><td>沒有鑰匙的人看不懂內容</td></tr>
      <tr><td>同一把鑰匙能鎖也能開的箱子</td><td>對稱加密<span class="en">Symmetric Encryption</span></td><td>雙方要事先共享同一把金鑰</td></tr>
      <tr><td>打開的掛鎖：誰都能扣上</td><td>公鑰<span class="en">Public Key</span></td><td>可以公開發給任何人</td></tr>
      <tr><td>掛鎖的鑰匙：只在阿哲身上</td><td>私鑰<span class="en">Private Key</span></td><td>只有主人持有，用來解開</td></tr>
      <tr><td>文件的指紋：改一個字就完全不同</td><td>雜湊<span class="en">Hash</span></td><td>發現內容有沒有被改過</td></tr>
    </tbody>
  </table>
</div>
<p class="swipe-hint">← 表格可以左右滑動 →</p>
<p class="limit"><b>比喻的極限</b>真實的鎖可以被撬開，但設計良好的加密演算法，用全世界的電腦也沒辦法在合理時間內硬猜出金鑰。反過來，密碼學只保護「箱子鎖著的時候」：收件人的電腦如果被駭，解開後的內容照樣外洩。還有，指紋是每個人獨有的，雜湊卻在理論上可能出現兩份內容同一個值，只是好的演算法讓人實際上找不到。</p>

<aside class="co co-terms">
  <div class="co-h">本課新名詞</div>
  <dl class="terms">
    <div><dt>雜湊<span class="en">Hash</span></dt><dd>把任意長度的資料變成固定長度的「指紋」，無法反推回原文。</dd></div>
    <div><dt>加密／解密<span class="en">Encryption / Decryption</span></dt><dd>用金鑰把看得懂的明文變成看不懂的密文；解密是反過來。</dd></div>
    <div><dt>金鑰<span class="en">Key</span></dt><dd>加密和解密時用的秘密數值。演算法可以公開，金鑰不行。</dd></div>
    <div><dt>對稱加密<span class="en">Symmetric Encryption</span></dt><dd>加密和解密用同一把金鑰，例如 AES。速度快。</dd></div>
    <div><dt>非對稱加密<span class="en">Asymmetric / Public-key Encryption</span></dt><dd>一對金鑰：公鑰公開、私鑰自己留。用公鑰加密的東西，只有私鑰解得開。</dd></div>
  </dl>
</aside>

<h2>正式拆解①：雜湊是指紋，不是加密</h2>
<p><b class="lead">第 01 課說完整性要能「發現被改過」。要怎麼快速知道一個 2GB 的檔案有沒有被動過一個位元？</b>答案是比對它的<dfn data-term="hash">雜湊</dfn>。雜湊函式會把任意長度的資料，算成一段固定長度的值。目前最常用的 SHA-256，不管輸入是一個字還是一部電影，輸出永遠是 256 個位元，寫成 64 個十六進位字元（0–9、a–f）。</p>
<p>好的雜湊函式有四個性質：</p>
<ul>
  <li><b>固定長度：</b>輸出長度跟輸入長度無關。</li>
  <li><b>單向：</b>從雜湊值沒辦法算回原文。雜湊沒有「金鑰」，也沒有「解密」這個動作。</li>
  <li><b>雪崩效應：</b>輸入只改一個字，輸出會有大約一半的位元跟著改變，看起來完全不相關。</li>
  <li><b>抗碰撞：</b>實際上找不到兩份不同的內容，算出同一個雜湊值。</li>
</ul>
<p>下面的實驗會在你的瀏覽器裡即時計算 SHA-256。試著只改一個字，看看有多少位元改變。</p>

<div data-widget="avalanche"></div>

<p>雜湊在日常開發裡到處都是。你每天用的 Git，每個 commit 的編號就是內容的雜湊值，所以任何一個歷史紀錄被偷改，後面所有編號都會對不上。軟體官網公布的 SHA-256 值，讓你確認下載的安裝檔跟官方的那份一模一樣。第 06 課還會用它來保存密碼。</p>
<p>要注意的是，較舊的 MD5 和 SHA-1 已經被找到碰撞（2017 年研究者公開了兩份內容不同、SHA-1 相同的 PDF），不能再用在安全用途。</p>

<div class="q" data-kind="check" data-qid="l04-c1">
  <div class="q-prompt"><p>你下載了一個安裝檔，自己算出的 SHA-256 跟官網公布的一樣。這能證明什麼？有什麼是它證明不了的？</p></div>
  <div class="q-ans">
    <p><b>能證明：</b>你手上的檔案跟官網公布雜湊值的那一份完全相同，下載途中沒有被改。</p>
    <p><b>證明不了：</b>如果攻擊者駭進官網，同時換掉安裝檔和網頁上的雜湊值，你算出來還是「一樣」。要擋住這種情況，需要第 05 課的數位簽章。</p>
  </div>
</div>

<h2>正式拆解②：對稱加密與金鑰交換的難題</h2>
<p><b class="lead">雜湊只能發現竄改，不能保密。要讓別人看不懂內容，需要加密。</b>最直覺的做法是<dfn data-term="symmetric">對稱加密</dfn>：明文加上金鑰，算出密文；同一把金鑰再把密文變回明文。現在最普遍的對稱演算法是 AES，筆電的硬碟加密、Wi-Fi 的 WPA2／WPA3、HTTPS 傳送的網頁內容，都靠它。</p>
<div class="calc" role="group" aria-label="對稱加密示意">
  <div class="row"><span>→</span><span>明文「週五下午三點簽約」＋ 金鑰 K ─AES→ 密文 <em>9f3a…c01e</em></span></div>
  <div class="row"><span>←</span><span>密文 9f3a…c01e ＋ 同一把金鑰 K ─AES→ 明文「週五下午三點簽約」</span></div>
</div>
<p>AES 本身非常堅固。以 128 位元的金鑰來說，可能的金鑰有 2¹²⁸ 把，大約是 3.4 × 10³⁸：</p>
<div class="calc" role="group" aria-label="暴力破解 AES-128 所需時間">
  <div class="row"><span>1</span><span>假設有一台每秒能試 10¹⁸ 把金鑰的夢幻電腦（遠超過現實）</span></div>
  <div class="row"><span>2</span><span>全部試完：3.4 × 10³⁸ ÷ 10¹⁸ ＝ 3.4 × 10²⁰ 秒</span></div>
  <div class="row"><span>3</span><span>換算成年：3.4 × 10²⁰ ÷（每年約 3.16 × 10⁷ 秒）≈ <em>1.1 × 10¹³ 年</em></span></div>
  <div class="row"><span>4</span><span>宇宙年齡約 1.38 × 10¹⁰ 年，所以要花<em>大約 800 個宇宙年齡</em></span></div>
</div>
<p>所以攻擊者通常不硬猜金鑰，而是去偷金鑰。這就回到生活情境的難題：<b>金鑰要怎麼安全地交給對方？</b>更麻煩的是人一多，金鑰的數量會爆炸。每兩個人之間都要一把專屬金鑰的話：</p>
<div class="calc" role="group" aria-label="兩兩通訊需要的金鑰數">
  <div class="row"><span>1</span><span>n 個人兩兩配對，需要 n × (n − 1) ÷ 2 把金鑰</span></div>
  <div class="row"><span>2</span><span>10 人：10 × 9 ÷ 2 ＝ <em>45 把</em></span></div>
  <div class="row"><span>3</span><span>100 人：100 × 99 ÷ 2 ＝ <em>4,950 把</em></span></div>
  <div class="row"><span>4</span><span>一個有 100 萬使用者的網站，要跟每個人都事先約好金鑰？<em>不可能</em></span></div>
</div>

<div class="q" data-kind="check" data-qid="l04-c2">
  <div class="q-prompt"><p>既然 AES 幾乎不可能被硬猜破解，為什麼資料用 AES 加密後還是可能外洩？</p></div>
  <div class="q-ans">
    <p><b>答案：</b>因為攻擊者會去拿金鑰，而不是猜金鑰。金鑰寫在程式碼裡、存在跟資料同一台機器上、被員工外流，加密就形同虛設。</p>
    <p><b>為什麼：</b>加密把「保護資料」變成「保護金鑰」。演算法再強，金鑰管理做不好也沒用。</p>
  </div>
</div>

<h2>正式拆解③：非對稱加密與 Diffie-Hellman</h2>
<p><b class="lead">1970 年代，密碼學家找到了解決金鑰交換難題的方法，也就是生活情境裡那把「打開的掛鎖」。</b><dfn data-term="asymmetric">非對稱加密</dfn>讓每個人擁有一對數學上相關的金鑰：公鑰可以發給全世界，私鑰只有自己知道。別人用你的公鑰加密的內容，只有你的私鑰解得開。100 萬個使用者，每人只需要一對金鑰。</p>
<p>另一個更直接回答「先猜猜看」的方法叫 Diffie-Hellman 金鑰交換。它讓兩個人在所有對話都被偷聽的情況下，各自算出同一個秘密。先用顏料來理解：</p>

<div data-widget="dh-paint"></div>

<p class="limit"><b>比喻的極限</b>現實中的顏料其實可以靠化學分析分離。數學版本的「無法分離」，靠的是一種正著算很快、反著算極慢的運算。</p>

<h3>做一次：用小數字算一次 Diffie-Hellman</h3>
<p>先認識一個工具：<b>時鐘算術</b>。時鐘上 13 點就是 1 點，因為 13 除以 12 餘 1，寫成 13 mod 12 ＝ 1。「mod」就是「除完取餘數」。</p>
<div class="calc" role="group" aria-label="Diffie-Hellman 計算過程">
  <div class="row"><span>0</span><span>公開約定（偷聽者也知道）：p ＝ 23，g ＝ 5</span></div>
  <div class="row"><span>1</span><span>小安秘密選 a ＝ 6；阿哲秘密選 b ＝ 15（各自不說）</span></div>
  <div class="row"><span>2</span><span>小安算 A ＝ 5⁶ mod 23 ＝ 15625 mod 23 ＝ <em>8</em>，公開寄出</span></div>
  <div class="row"><span>3</span><span>阿哲算 B ＝ 5¹⁵ mod 23 ＝ <em>19</em>，公開寄出</span></div>
  <div class="row"><span>4</span><span>小安用收到的 B 算：19⁶ ＝ 47,045,881，mod 23 ＝ <em>2</em></span></div>
  <div class="row"><span>5</span><span>阿哲用收到的 A 算：8¹⁵ mod 23 ＝ <em>2</em></span></div>
  <div class="row"><span>6</span><span>兩人得到同一個秘密 <em>2</em>，但 6、15、2 都沒有在網路上出現過</span></div>
</div>
<p>偷聽者手上有 23、5、8、19。要算出秘密，他得從「5 的幾次方 mod 23 等於 8」反推出 6。數字小的時候可以一個一個試，真實世界用的數字長達數百位數（或改用橢圓曲線），試到宇宙結束都試不完。這個「反推很難」的問題叫離散對數問題。</p>
<p>非對稱運算比對稱加密慢得多，所以實務上兩者一起用：先用 Diffie-Hellman 或公鑰安全地約定出一把對稱金鑰，接下來的大量資料改用快速的 AES 傳送。這種組合叫<b>混合加密</b>，下一課的 HTTPS 就是這樣運作的。</p>

<div class="q" data-kind="check" data-qid="l04-c3">
  <div class="q-prompt"><p>在上面的計算裡，如果偷聽者把 A ＝ 8 和 B ＝ 19 相乘或相加，能不能得到秘密 2？為什麼 Diffie-Hellman 不怕這種嘗試？</p></div>
  <div class="q-ans">
    <p><b>答案：</b>不能。8 × 19 mod 23 ＝ 14，8 ＋ 19 mod 23 ＝ 4，都不是 2。</p>
    <p><b>為什麼：</b>共同秘密等於 g 的 (a × b) 次方 mod p。只拿 A 和 B 做運算，湊不出 a × b 這個次方；必須知道 a 或 b 其中一個，也就是要先解開離散對數問題。</p>
  </div>
</div>

<aside class="co co-aha" data-guess="l04-g">
  <div class="co-h">本課最重要的「啊哈」</div>
  <p>密碼學把「保護一大堆資料」變成「保護一把小小的金鑰」。演算法本身是公開的，全世界的專家都能檢查；真正的秘密只有金鑰。所以一個系統的加密做得好不好，大部分取決於金鑰放在哪、誰拿得到。</p>
  <p><b>開頭的問題：</b>可以。Diffie-Hellman 就是這樣做的：雙方在公開頻道上交換的，都是「混合過」的值，各自的秘密從來沒離開過自己；再利用反推很難的數學問題，讓偷聽者就算全程聽到，也算不出最後的共同秘密。</p>
</aside>

<aside class="co co-warn">
  <div class="co-h">常見誤解</div>
  <p class="co-quote">「雜湊是一種加密，網路上的『MD5 解密網站』可以把它解回原文。」</p>
  <p>這個誤解很常見，因為雜湊的輸出看起來跟密文一樣是一串亂碼，而那些網站也真的能把某些雜湊「變回」原文。實際上它們做的是查表：事先把大量常見字串的雜湊算好存起來，你丟一個雜湊進去，它查到就回答。雜湊本身沒有金鑰，也沒有解密這回事；查不到的內容，它一樣束手無策。</p>
  <p>這正是第 06 課要解決的問題：如果密碼只是單純雜湊，常見密碼一查就中，所以存密碼還需要「加鹽」和「慢雜湊」。</p>
</aside>

<details class="deep">
  <summary>延伸（可跳過）<small>Base64、公開演算法原則、量子電腦</small></summary>
  <div>
    <p><b>Base64 是編碼，不是加密。</b>你可能在 API 或網址裡看過 <code>aGVsbG8=</code> 這種字串，它只是把資料換一種寫法方便傳送，任何人都能直接轉回來（這串就是 hello）。把密碼用 Base64 存起來，等於存明文。</p>
    <p><b>為什麼演算法要公開？</b>19 世紀的密碼學家 Kerckhoffs 提出：一個密碼系統就算除了金鑰以外的一切都被敵人知道，也應該是安全的。自己發明、不公開的演算法，通常只是還沒被人研究過，而不是安全。</p>
    <p><b>量子電腦的威脅。</b>夠大的量子電腦可以快速解開目前的非對稱加密（包括 Diffie-Hellman 和 RSA），對稱加密則受影響較小。美國 NIST 在 2024 年 8 月正式公布了第一批「後量子密碼」標準（FIPS 203、204、205），各大瀏覽器和系統已經開始導入。有些攻擊者現在就先把加密流量存起來，等將來再解，這叫「先收集、後解密」。</p>
  </div>
</details>

<p>回顧 <button type="button" class="xref" data-lesson="03">回顧第 03 課：STRIDE</button> 裡的 T 和 I：雜湊負責發現竄改，加密負責防止洩露。但你可能已經發現一個漏洞：跟你交換金鑰的人，真的是你以為的那個人嗎？下一課的數位簽章和憑證，就是在補這個洞。</p>

<h2>本課三個重點</h2>
<ol class="keys">
  <li>雜湊把資料變成固定長度的指紋：單向、改一個字就面目全非，用來發現竄改；它沒有金鑰，也不能解密。</li>
  <li>對稱加密（如 AES）快又堅固，但金鑰要事先交給對方；非對稱加密和 Diffie-Hellman 讓陌生人能在被偷聽的情況下約定出秘密。</li>
  <li>實務上兩者合用：非對稱運算約定金鑰，對稱加密傳資料；整套系統的安全，最後取決於金鑰有沒有保護好。</li>
</ol>

<h2>練習</h2>
<div class="q" data-kind="practice" data-level="y" data-qid="l04-p1">

    <p class="q-title">選對工具</p>
    <p>下面四個情境，各該用雜湊、對稱加密，還是非對稱加密（可以不只一種）？</p>

  <div class="q-ans">
    <p><b>答案：</b>（a）雜湊。（b）對稱加密。（c）先用非對稱方式（Diffie-Hellman）約定金鑰，再用對稱加密傳資料。（d）雜湊，而且要加鹽、用慢雜湊（第 06 課）。</p>

    <p><b>常見卡點：</b>（d）答成加密。加密代表能解密，只要金鑰外洩，全部密碼就回到原文。</p>

</div>
<div class="q" data-kind="practice" data-level="y" data-qid="l04-p2">

  <div class="q-ans">

    <p><b>為什麼：</b>對稱金鑰的數量隨人數平方成長，非對稱只隨人數線性成長，這就是公鑰制度能撐起整個網際網路的原因。</p>

</div>

  <div class="q-ans">
    <p><b>好答案會包含：</b>①加密的安全只靠金鑰保密，而前端程式會下載到每個使用者的瀏覽器，任何人打開開發者工具就能拿到金鑰。②前端在信任邊界外，放在那裡的東西都要當成公開的。③拿到這把金鑰的人，只要再拿到資料庫的備份或 API 回傳的密文，就能解開<b>所有</b>使用者的資料。</p>

<h2>心智模型：網站也有護照</h2>
<p>網站證明自己身分的方式，跟護照幾乎一樣：</p>

<p class="limit"><b>比喻的極限</b>護照證明的是「你是誰」，而最常見的網站憑證只證明「申請的人控制這個網域」，不會告訴你背後是哪家公司，更不保證它是好人。另外，護照一本用十年，網站憑證的效期很短，而且正在縮短：從 2026 年 3 月起最長 200 天，2029 年將縮到 47 天，幾乎都靠程式自動更新。</p>

<aside class="co co-terms">

<h2>正式拆解②：憑證與信任鏈</h2>
<p><b class="lead">驗證簽章需要對方的公鑰。但你第一次連上銀行網站時，怎麼知道收到的公鑰真的是銀行的，而不是中間某個人換上的？</b>答案是讓一個大家都信任的第三方替它背書。<dfn data-term="ca">憑證機構</dfn>審核「申請者確實控制 bank.example 這個網域」之後，用自己的私鑰簽署一份文件：「bank.example 的公鑰是這一把」。這份文件就是<dfn data-term="certificate">憑證</dfn>。</p>
<p>實務上是一條鏈。作業系統和瀏覽器出廠時內建了一份清單，裡面有一百多個被信任的<b>根憑證</b>。根憑證很少直接簽網站憑證，而是先簽<b>中繼憑證</b>，再由中繼憑證簽網站憑證。瀏覽器拿到網站憑證後，會一路往上檢查：</p>
<ol>
  <li>網站憑證的簽章，用中繼憑證的公鑰驗得過嗎？</li>
  <li>中繼憑證的簽章，用根憑證的公鑰驗得過嗎？</li>
  <li>這個根憑證在我的信任清單裡嗎？</li>
  <li>憑證上的網域，跟我正在連的網址一樣嗎？憑證還在有效期限內嗎？</li>
</ol>
<p>任何一步失敗，瀏覽器就會跳出全頁的紅色警告。下面的實驗讓你親手竄改一張憑證，看它在哪一步被抓到。</p>

<div data-widget="cert-chain"></div>

<div class="q" data-kind="check" data-qid="l05-c2">
  <div class="q-prompt"><p>攻擊者自己做了一張寫著「bank.example」的憑證，並用自己的私鑰簽名，而且簽章本身完全正確。瀏覽器會在哪一步拒絕它？</p></div>
  <div class="q-ans">
    <p><b>答案：</b>第 3 步。簽章可以驗得過，但一路往上追，最頂端的簽名者是攻擊者自己，不在瀏覽器的信任清單裡。</p>
    <p><b>為什麼：</b>憑證的價值不在「有簽章」，而在「簽章追得到一個被信任的根」。這也是為什麼 CA 本身被入侵會是大災難，延伸區有真實案例。</p>
  </div>
</div>

<h2>正式拆解③：TLS 交握在做什麼</h2>
<p><b class="lead">現在把第 04 課和本課的工具全部組起來。</b>你在網址列輸入 https:// 開頭的網址，瀏覽器和伺服器會先進行一段叫「交握」的對話，在大約一次來回之內完成三件事：約定金鑰、確認伺服器身分、確認對話沒被竄改。目前主流的 TLS 1.3 流程如下，點「下一步」逐步觀察，特別留意「偷聽者看得到什麼」那一列。</p>

<div data-widget="tls-handshake"></div>

<p>第 4 步是很多人忽略的關鍵。憑證本身是公開的，任何人都能下載一份 bank.example 的憑證。光出示憑證不能證明身分，伺服器還得用憑證裡公鑰對應的<b>私鑰</b>，對這次對話簽一個名。攻擊者沒有私鑰，就過不了這一關。</p>
<h3>HTTPS 保證什麼、不保證什麼</h3>
<div class="scroll-x">
  <table class="tbl">
    <thead><tr><th>保證</th><th>不保證</th></tr></thead>
    <tbody>
      <tr><td>傳輸途中，別人看不到內容（機密性）</td><td>網站的經營者是好人</td></tr>
      <tr><td>傳輸途中被改，一定會被發現（完整性）</td><td>網站本身沒有被駭、沒有漏洞</td></tr>
      <tr><td>你連到的，就是網址列上的那個網域（真實性）</td><td>網址列上的網域就是你以為的那家公司</td></tr>
      <tr><td></td><td>資料送到伺服器之後會被好好保管</td></tr>
    </tbody>
  </table>
