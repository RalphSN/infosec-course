</div>
<p class="swipe-hint">← 表格可以左右滑動 →</p>
<p class="limit"><b>比喻的極限</b>魔術是你知道被騙、且同意被騙的娛樂；社交工程是在你不知情時造成真實傷害。而且魔術師一次騙一場觀眾，社交工程可以用一封範本信同時寄給上百萬人，只要有極少數人上當就成功。</p>

<aside class="co co-terms">
  <div class="co-h">本課新名詞</div>
  <dl class="terms">
    <div><dt>社交工程<span class="en">Social Engineering</span></dt><dd>透過操縱人的心理來取得資訊或存取權，而不是攻破技術。</dd></div>
    <div><dt>釣魚<span class="en">Phishing</span></dt><dd>假冒可信對象，誘騙人點連結、交出帳密或執行動作。針對特定人的叫魚叉式釣魚。</dd></div>
    <div><dt>資安治理<span class="en">Security Governance</span></dt><dd>組織用來管理資安的政策、角色、流程與問責機制。</dd></div>
    <div><dt>NIST CSF 2.0</dt><dd>美國國家標準暨技術研究院的資安框架，用六大功能組織資安工作。</dd></div>
    <div><dt>個資會<span class="en">個人資料保護委員會</span></dt><dd>台灣 2025 年修法後統一的個資主管機關。</dd></div>
  </dl>
</aside>

<h2>正式拆解①：社交工程的心理槓桿</h2>
<p><b class="lead">你可以把技術防線築得滴水不漏，但只要有一個人被騙，攻擊者就能拿到合法的鑰匙、大搖大擺地走進正門。</b>這就是<dfn data-term="social">社交工程</dfn>，也是絕大多數資安事件真正的起點。它不攻擊系統，而是利用幾個人人都有的心理反應：</p>
<div class="scroll-x">
  <table class="tbl">
    <thead><tr><th>心理槓桿</th><th>攻擊者怎麼用</th></tr></thead>
    <tbody>
      <tr><td>權威</td><td>假冒老闆、IT 主管、警察、國稅局，讓你不敢質疑</td></tr>
      <tr><td>急迫感</td><td>「帳號將在 30 分鐘後停用」「主管在開會急著要」，逼你來不及查證</td></tr>
      <tr><td>互惠與人情</td><td>先給你一點好處或幫個小忙，讓你不好意思拒絕他的要求</td></tr>
      <tr><td>從眾</td><td>「同部門的人都已經填了」，利用你不想當異類的心理</td></tr>
      <tr><td>好奇與貪</td><td>「你的照片外流了，點這裡看」「你中獎了」</td></tr>
      <tr><td>怕麻煩、想幫忙</td><td>假冒新同事求助，讓熱心的你替他開門、重設密碼</td></tr>
    </tbody>
  </table>
</div>
<p class="swipe-hint">← 表格可以左右滑動 →</p>
<p>最常見的載體是<dfn data-term="phishing">釣魚</dfn>。針對一般大眾的廣撒網之外，還有針對特定高價值目標的「魚叉式釣魚」，攻擊者會先研究你的職稱、專案、同事關係，寫出高度客製、幾可亂真的訊息，例如冒充你正在合作的廠商窗口。近年 AI 讓這件事更容易：偽造的語音、影片和更流暢的文案，都降低了行騙的成本。</p>
<p>下面的檢查器用一封虛構品牌的可疑信件，讓你練習逐一點出紅旗。</p>

<div data-widget="phish-check"></div>

<div class="q" data-kind="check" data-qid="l17-c1">
  <div class="q-prompt"><p>一封信寫著「您的帳號有異常，請於 30 分鐘內點此連結驗證，否則永久停用」，署名是你常用的某銀行。信裡同時用了哪兩個心理槓桿？你應該怎麼查證？</p></div>
  <div class="q-ans">
    <p><b>心理槓桿：</b>權威（冒充銀行）和急迫感（30 分鐘、否則停用）。</p>
    <p><b>查證：</b>不要點信裡的連結，改用自己記得的官方網址或 App 登入查看，或打銀行卡背面的官方電話。真的有問題，從官方管道一樣查得到；急迫感正是要阻止你走這一步。</p>
  </div>
</div>

<h2>正式拆解②：資安框架，把個人英雄變成組織日常</h2>
<p><b class="lead">前面十六課大多在講「怎麼做對某一件事」。但一個組織不能靠某幾個人記得做對，需要制度。</b>這就是<dfn data-term="governance">資安治理</dfn>：用政策、角色、流程把安全變成日常，而不是靠英雄救火。國際上有兩個最常被引用的框架，它們不是要你死背，而是提供一份「有沒有漏掉什麼」的檢查地圖：</p>
<p><b>NIST CSF 2.0</b>（<dfn data-term="csf">網路安全框架</dfn>）用六大功能來組織所有資安工作，你會發現這門課正好散落在這六項裡：</p>

<div data-widget="csf-wheel"></div>

<p><b>ISO/IEC 27001</b> 則是一套「資訊安全管理系統」的國際標準，企業可以通過驗證取得證書。它的核心精神是 PDCA 循環（規劃、執行、檢查、改進）：資安不是做一次，而是持續運轉的管理制度。很多客戶或招標會要求供應商具備 ISO 27001 驗證，所以它也常是商業上的通行證。</p>
<p>這兩者的差別：CSF 是彈性的「參考框架」，幫你評估與溝通現況；ISO 27001 是可驗證的「管理標準」，有明確的要求可以稽核。對開發者來說，重點不是背下條文，而是理解一件事：<b>你在寫的每一段安全相關的程式，背後都對應到組織的某條政策；而政策需要有人負責、被落實、被檢查</b>。</p>

<div class="q" data-kind="check" data-qid="l17-c2">
  <div class="q-prompt"><p>NIST CSF 2.0 在 2024 年新增了「治理（Govern）」這個功能，放在其他五項的中心。為什麼「治理」要當核心，而不只是其中一項？</p></div>
  <div class="q-ans">
    <p><b>答案：</b>因為識別、保護、偵測、回應、復原這五項要做到什麼程度、由誰負責、如何分配資源、如何問責，全都由治理決定。沒有治理，其他五項就變成沒人統籌、各做各的零散活動。治理是貫穿全部的方向盤，所以放在中心。</p>
  </div>
</div>

<h2>正式拆解③：台灣的資安與個資法規</h2>
<p><b class="lead">在台灣開發、營運系統，有兩部法律和你最相關：管「個人資料」的個資法，和管「特定機構資安」的資安法。近年兩者都有重大修正。</b></p>
<h3>個人資料保護法（個資法）</h3>
<p>個資法規範所有蒐集、處理、利用個人資料的組織，適用範圍最廣，幾乎任何有會員的系統都受它規範。2025 年的修正有幾個重點：</p>
<ul>
  <li><b>成立獨立的主管機關：</b>過去個資業務分散在各部會，修法設立統一的「個人資料保護委員會」（<dfn data-term="pdpc">個資會</dfn>），作為專責的獨立機關。</li>
  <li><b>強化外洩通報與通知：</b>發生個資被竊取、竄改、毀損、遺失或洩漏時，企業必須通報主管機關，並通知受影響的當事人；修法明確要求<b>不得以「尚未查明」為由延遲通知當事人</b>。具體的通報範圍與時限由個資會以子法訂定。</li>
  <li><b>明確的安全維護義務與罰則：</b>要求採取適當的安全維護措施，未訂定或未落實者可處罰，且主管機關得逕行處罰。</li>
</ul>
<p>這些條文和你學過的技術直接對應：加密（第 04 課）、存取控制（第 07 課）、偵測與日誌（第 15 課）、事件應變與通報（第 16 課），正是「安全維護措施」的具體內容。第 02 課「不蒐集用不到的資料」的原則，也呼應個資法「蒐集應與目的相關、不得逾越必要範圍」的精神。</p>
<h3>資通安全管理法（資安法）</h3>
<p>資安法的適用對象較窄，主要是<b>公務機關</b>和<b>特定非公務機關</b>（例如關鍵基礎設施提供者，如能源、水利、通訊、金融、醫院等）。一般的中小型網站通常不直接適用，但如果你的公司是這些機構的供應商，就會透過委外合約間接受到規範。2025 年 9 月修正公布、並自 2025 年 12 月 1 日施行的版本重點包括：</p>
<ul>
  <li>主管機關明定為<b>數位發展部</b>；</li>
  <li>將「公務機關不得使用危害國家資通安全產品」的規範提升到法律位階；</li>
  <li>要求特定機構設置資安長與專職資安人員、簽訂書面委外契約；</li>
  <li>提高罰則，未依規定通報資安事件最高可罰新臺幣 1,000 萬元。</li>
</ul>
<aside class="co co-info">
  <div class="co-h">重要提醒</div>
  <p>本課對法規的說明是幫助你建立整體概念，內容以 2026 年 9 月可查到的資訊為準，法規細節（尤其是通報時限等子法）仍在陸續發布。實際遵法請以主管機關公告的最新條文為準，並在需要時諮詢法律專業人員。這一段不是法律意見。</p>
</aside>

<div class="q" data-kind="check" data-qid="l17-c3">
  <div class="q-prompt"><p>你做的是一個一般的電商網站，會員資料裡有姓名、電話、地址。個資法和資安法，哪一部一定和你相關？為什麼另一部通常不直接適用？</p></div>
  <div class="q-ans">
    <p><b>答案：</b>個資法一定相關，因為你蒐集、處理了會員的個人資料。資安法通常不直接適用，因為它的對象主要是公務機關和關鍵基礎設施等特定非公務機關；一般電商不在其中，除非你是這些機構的供應商而被合約要求。</p>
  </div>
</div>

<aside class="co co-aha" data-guess="l17-g">
  <div class="co-h">本課最重要的「啊哈」</div>
  <p>資安最脆弱的一環往往不是技術，而是人。社交工程繞過所有技術防線，直接騙人交出鑰匙。所以真正的防禦是「技術＋人＋制度」三者一起：技術築牆，意識訓練讓人不被騙，治理與法規讓安全成為組織持續運轉的日常，而不是靠某個人的記憶或運氣。</p>
  <p><b>開頭的問題：</b>防不住。再先進的設備，也擋不住員工「自願」把驗證碼念給假冒的 IT 人員，因為對系統來說那是一次合法的操作。防這種攻擊要靠意識訓練（教大家「IT 絕不會用電話索取驗證碼」）、流程（重設一律走內部工單）和抗釣魚的驗證方式（第 06 課的 Passkey）。</p>
</aside>

<aside class="co co-warn">
  <div class="co-h">常見誤解</div>
  <p class="co-quote">「會被釣魚、被詐騙的，都是不懂電腦的人。我這麼懂技術，不可能上當。」</p>
  <p>這個想法本身就是最大的破綻。社交工程攻擊的不是知識，而是人的正常心理反應：忙碌、疲累、想幫忙、怕得罪權威。研究一再顯示，資安專業人員在特定情境下一樣會上當，尤其是攻擊者做足功課、時機又剛好的魚叉式釣魚。「我不可能上當」的自信，會讓你放下查證的習慣。</p>
  <p>檢查方法：真正的防禦不是「相信自己不會被騙」，而是建立不依賴當下判斷的習慣，例如「任何索取憑證或要求匯款的訊息，一律用另一個管道查證」。</p>
</aside>

<details class="deep">
  <summary>延伸（可跳過）<small>BEC 詐騙、資安意識訓練、GDPR</small></summary>
  <div>
    <p><b>商業電子郵件詐騙（BEC）。</b>攻擊者冒充公司高層或供應商，發信要求財務人員匯款到指定帳戶，是造成損失金額最高的社交工程之一，全球累計損失以數十億美元計。防範靠的不是技術，而是流程：任何變更匯款帳戶的要求，一律用電話等第二管道向本人確認。</p>
    <p><b>資安意識訓練有沒有用？</b>有，但方式很重要。一次性的年度講座效果有限；持續的、包含「模擬釣魚演練」（公司自己發假的釣魚信，點了的人會看到教學而非被懲罰）的做法效果較好。重點是營造「回報可疑訊息會被感謝、而不是被責備」的文化，這樣真的有人中招時才會及時通報。</p>
    <p><b>GDPR。</b>如果你的服務有歐洲的使用者，就會受到歐盟《一般資料保護規則》(GDPR) 規範，它對外洩通報（知悉後 72 小時內通報主管機關）、當事人權利、罰則（最高可達全球年營業額 4%）都有嚴格要求，影響了包括台灣在內許多地區的個資立法方向。</p>
  </div>
</details>

<h2>本課三個重點</h2>
<ol class="keys">
  <li>社交工程攻擊的是人的正常心理反應（權威、急迫、想幫忙），而非技術；它能繞過所有技術防線，因為受害者是「自願」交出鑰匙的。</li>
  <li>資安治理用政策、角色、流程把安全變成組織日常；NIST CSF 2.0（六大功能、治理居中）和 ISO 27001（可驗證的管理標準）是兩個常用的參考框架。</li>
  <li>在台灣，個資法規範幾乎所有有會員的系統（2025 年修法設個資會、強化外洩通報）；資安法主要規範公務機關與關鍵基礎設施（2025 年 12 月施行，罰則最高 1,000 萬元）。</li>
</ol>

<h2>練習</h2>
<div class="q" data-kind="practice" data-level="y" data-qid="l17-p1">

    <p>下面三則訊息各主要利用了哪些心理槓桿？收到時你會怎麼查證？</p>
    <p>（a）LINE 訊息：「我是你主管，現在在開會不方便講電話，急需你幫我買 5 張超商點數卡，先墊一下，等等還你。」<br>（b）Email：「HR 通知：全體員工需在今日下班前重新確認薪資帳戶，逾期影響本月薪轉。」附一個登入連結。<br>（c）電話：「這裡是資訊部，我們偵測到你的電腦中毒，需要你提供遠端連線代碼讓我們處理。」</p>

    <p><b>查證：</b>三者共通的做法都是「換一個管道確認本人」：（a）直接打電話或當面問主管；（b）用自己記得的公司系統網址登入，不點信裡連結；（c）掛掉電話，主動打資訊部的官方分機確認。攻擊者最怕的就是你多這一步。</p>
  </div>

<p class="lead">恭喜你走到最後一課。前面十七課，你各自學了風險思維、密碼學、身分與授權、應用程式攻防、AI 安全、系統與雲端防護、偵測應變、人與治理。這一課要把它們全部用在同一個系統上。</p>

<h2>建議步驟</h2>
<h3>第一步｜資產盤點與資料流程圖（對應第 01、02、03 課）</h3>
<p>先問「我們在保護什麼」。用第 02 課的方式列出資產，並用第 01 課的 CIA 標出每項資產最在意哪一面：</p>

<h3>第二步｜威脅建模與風險登錄（對應第 03、02 課）</h3>

<h3>第三步｜設計防護（對應第 04–14 課）</h3>
<p>把對策依「縱深防禦」的層次組織起來，你會看到整門課如何疊成一道道防線：</p>
<ul>
  <li><b>連線與資料（04、05）：</b>全站 HTTPS；資料庫加密；金鑰放在雲端秘密管理，不進前端、不進 Git。</li>
  <li><b>身分與授權（06、07）：</b>密碼用 Argon2id、提供 Passkey；每支 API 檢查身分與擁有者；最小權限的角色設計。</li>
  <li><b>應用程式（08、09、10）：</b>參數化查詢；Vue 用 {{ }}、不對使用者內容用 v-html、設 CSP；cookie 設 SameSite；用 lock 檔與 SCA 管相依套件。</li>
  <li><b>AI 客服（11）：</b>查訂單工具用登入者身分、不接受模型傳來的編號；沒有寄信或付款工具；回覆以純文字顯示；記錄每次工具呼叫。</li>
  <li><b>系統與雲端（13、14）：</b>網路分段（資料庫不對外）；服務用短期憑證與最小 IAM 權限；開啟雲端資安狀態檢查。</li>
</ul>

<h3>第四步｜偵測、應變與治理（對應第 15、16、17 課）</h3>
<ul>
  <li><b>偵測（15）：</b>集中收集日誌（記登入、權限變更、大量資料存取，但不記密碼與完整個資）；設定高品質告警，例如「陌生地點登入＋立即大量匯出」。</li>
  <li><b>應變與韌性（16）：</b>寫好事件應變計畫、指定指揮者；資料庫有離線且測試過的備份；訂出 RTO／RPO。</li>
  <li><b>人與治理（17）：</b>員工資安意識與模擬釣魚演練；因為有會員個資，先弄清楚個資法的外洩通報義務，寫進應變計畫。</li>
</ul>

<aside class="co co-aha">
  <div class="co-h">整門課的一句話</div>
  <p><b>信任要被驗證，而不是被假設。</b>你回頭看會發現，這十八課裡的每一種攻擊，本質上都是某個東西被錯誤地信任了：資料被當成指令（注入）、客戶端被當成可信（IDOR、作弊）、內網被當成安全（橫向移動）、憑證被當成身分保證（釣魚）、套件被當成自己人（供應鏈）、模型被當成聽話（提示詞注入）、人被當成不會被騙（社交工程）。而每一種防護，都是把「假設的信任」換成「驗證過的信任」。</p>
</aside>

<aside class="co co-warn">
  <div class="co-h">最後一個提醒</div>
  <p>資安不是一次做完的專案，而是持續的過程。系統每天在變、攻擊手法每天在進化、你依賴的套件每天在更新。這份藍圖不是終點，而是一個要定期回來檢視、更新的活文件，正如第 03 課威脅建模的第四個問題：「我們做得夠好嗎？」這個問題永遠要再問一次。</p>
</aside>

<h2>本課三個重點</h2>
<ol class="keys">
  <li>面對任何系統，都用威脅建模的四個問題開場：盤點資產與資料流、用 STRIDE 找威脅、依風險排序選對策、再回頭檢查，這是把零散知識組織起來的骨架。</li>
  <li>好的防護是縱深的：連線、身分、應用、AI、系統雲端、偵測應變、人與治理層層疊起，任何一層失效還有下一層，沒有單一的萬靈丹。</li>
  <li>整門課的主軸是「信任要被驗證，而不是被假設」；而資安是持續的過程，防護藍圖要定期回來更新。</li>
</ol>

      plan: ['共同責任模型：雲端商管什麼、你管什麼', '身分與權限（IAM）：雲端的新邊界', '最常見的雲端事故：公開儲存空間、外洩金鑰、權限過大'], visuals: ['共同責任拼圖（IaaS／PaaS／SaaS 切換）', 'IAM 權限模擬器'] },
    { id: '15', stage: 4, status: 'ready', minutes: 30, title: '偵測與監控', sub: '你怎麼知道自己被入侵了', metaphor: '醫學篩檢',
      oneLine: '準確率 99% 的偵測器，發出的告警大多可能是誤報；偵測的關鍵是記對日誌、在攻擊鏈的每一步都有機會抓到。',
      canDo: '從一段日誌找出入侵痕跡；用基本比率解釋為什麼高準確率的偵測器仍多為誤報，並設計高品質的告警。',
      plan: ['攻擊鏈與 MITRE ATT&CK', '日誌該記什麼、不該記什麼', '基本比率謬誤與告警疲勞'], visuals: ['基本比率計算器', '日誌時間軸：找出入侵痕跡'] },
    { id: '16', stage: 4, status: 'ready', minutes: 30, title: '事件應變與韌性', sub: '出事之後怎麼辦', metaphor: '消防演習',
      oneLine: '沒演練過的應變計畫等於沒有計畫；沒還原過的備份等於沒有備份。',
      canDo: '排出事件應變的正確順序，說明為什麼先圍堵再根除才復原；檢查一個備份策略能不能抵抗勒索軟體，並解釋 RTO／RPO。',
      plan: ['應變流程：準備、偵測、圍堵、復原、檢討', '3-2-1 備份與勒索軟體', 'RTO／RPO 與營運持續'], visuals: ['勒索軟體桌上演練', 'RTO／RPO 時間軸'] },
    { id: '17', stage: 5, status: 'ready', minutes: 30, title: '人與治理', sub: '社交工程、資安框架與台灣法規', metaphor: '魔術師的注意力誘導',
      oneLine: '社交工程攻擊的是人的正常反應，不是人的無知；治理框架把資安從個人英雄變成組織的日常。',
      canDo: '辨識社交工程利用的心理槓桿並設計查證習慣；把資安工作對應到 NIST CSF 2.0，說明台灣個資法與資安法對你的系統的意義。',
      plan: ['社交工程的心理槓桿', 'NIST CSF 2.0 與 ISO 27001', '台灣資通安全管理法與個資法'], visuals: ['可疑信件檢查器（虛構品牌）', 'CSF 2.0 六功能環形圖'] },
    { id: '18', stage: 5, status: 'ready', minutes: 60, title: '總整合專題', sub: '幫一個系統做風險評估與防護藍圖', metaphor: '',
      oneLine: '把整門課串起來：為一個部署在雲端、附 AI 客服的 Vue 3 會員系統，做出完整的風險評估與防護藍圖。',
      canDo: '面對一個真實系統，獨立完成資產盤點、威脅建模、風險評分、對策設計與偵測應變規劃，產出一份完整的防護藍圖。',
      plan: ['資產盤點與威脅建模', '風險登錄表與對策', '雲端、AI 功能與應變計畫', '綜合複習與最終能力檢查'], visuals: ['互動風險工作表（可匯出）'] }
  ],
  glossary: [
    { k: 'infosec', zh: '資訊安全', en: 'Information Security', l: '01', d: '保護資訊與承載它的系統，讓資訊維持該有的機密性、完整性與可用性。常簡稱「資安」。' },
    { k: 'cia', zh: 'CIA 三要素', en: 'CIA Triad', l: '01', d: '機密性、完整性、可用性三者的合稱，是描述「安全」最基本的三個角度。名稱和美國中情局無關。' },
    { k: 'confidentiality', zh: '機密性', en: 'Confidentiality', l: '01', d: '只有被允許的人看得到資訊。' },
    { k: 'integrity', zh: '完整性', en: 'Integrity', l: '01', d: '資訊沒有被未經允許地修改；就算被改了，也能被發現。' },
    { k: 'availability', zh: '可用性', en: 'Availability', l: '01', d: '被允許的人在需要的時候，用得到資訊和系統。' },
    { k: 'attack-surface', zh: '攻擊面', en: 'Attack Surface', l: '01', d: '系統所有可能被攻擊者碰觸到的入口總和，例如登入頁、API、上傳功能、第三方套件、員工信箱。' },
    { k: 'ddos', zh: '分散式阻斷服務', en: 'DDoS, Distributed Denial of Service', l: '01', d: '指揮大量被控制的電腦同時向目標送出請求，把服務塞爆，讓正常使用者用不了。攻擊的是可用性。' },
    { k: 'ransomware', zh: '勒索軟體', en: 'Ransomware', l: '01', d: '把受害者的檔案加密鎖住、要求付贖金的惡意程式；現在常同時偷走資料，威脅不付錢就公開。' },
    { k: 'asset', zh: '資產', en: 'Asset', l: '02', d: '對你有價值、需要保護的東西：資料、系統、帳號、商譽，甚至員工的時間。' },
    { k: 'threat', zh: '威脅', en: 'Threat', l: '02', d: '可能對資產造成傷害的來源或事件：攻擊者、惡意程式、員工失誤、停電、天災。' },
    { k: 'vulnerability', zh: '弱點', en: 'Vulnerability', l: '02', d: '讓威脅能夠得逞的缺陷：沒更新的軟體、弱密碼、權限給太多、設定錯誤。' },
    { k: 'risk', zh: '風險', en: 'Risk', l: '02', d: '威脅利用弱點、對資產造成衝擊的「可能性」與「後果」的組合。常用「可能性 × 衝擊」來排序。' },
    { k: 'residual-risk', zh: '殘餘風險', en: 'Residual Risk', l: '02', d: '做完防護措施之後，仍然剩下的風險。永遠不會是零。' },
    { k: 'hash', zh: '雜湊', en: 'Hash', l: '04', d: '把任意長度的資料變成固定長度的「指紋」。單向、改一個字就完全不同，用來發現竄改；沒有金鑰，也不能解密。' },
    { k: 'encryption', zh: '加密／解密', en: 'Encryption / Decryption', l: '04', d: '用金鑰把看得懂的明文變成看不懂的密文；解密是反過來。' },
    { k: 'key', zh: '金鑰', en: 'Key', l: '04', d: '加密和解密時用的秘密數值。演算法可以公開，金鑰不行。' },
    { k: 'symmetric', zh: '對稱加密', en: 'Symmetric Encryption', l: '04', d: '加密和解密用同一把金鑰，例如 AES。速度快，但金鑰要事先安全地交給對方。' },
    { k: 'asymmetric', zh: '非對稱加密', en: 'Asymmetric / Public-key Encryption', l: '04', d: '一對金鑰：公鑰公開、私鑰自己留。用公鑰加密的東西，只有私鑰解得開。' },
    { k: 'dh', zh: 'Diffie-Hellman 金鑰交換', en: 'Diffie-Hellman Key Exchange', l: '04', d: '讓兩個人在對話全被偷聽的情況下，各自算出同一個秘密的方法。安全性來自離散對數問題。' },
    { k: 'signature', zh: '數位簽章', en: 'Digital Signature', l: '05', d: '用私鑰對內容的雜湊簽名，任何人都能用公鑰驗證：內容沒被改，而且真的是私鑰主人簽的。不提供保密。' },
    { k: 'certificate', zh: '憑證', en: 'Certificate (X.509)', l: '05', d: '由憑證機構簽名的電子文件，把網域名稱和公鑰綁在一起，並寫明有效期限。' },
    { k: 'ca', zh: '憑證機構', en: 'CA, Certificate Authority', l: '05', d: '審核並簽發憑證的單位。瀏覽器和作業系統內建一份信任的根憑證清單。' },
    { k: 'chain', zh: '信任鏈', en: 'Chain of Trust', l: '05', d: '網站憑證 → 中繼憑證 → 根憑證，一環一環用簽章串起來的信任關係。' },
    { k: 'tls', zh: 'TLS', en: 'Transport Layer Security', l: '05', d: '在網路連線上提供加密與身分驗證的協定。HTTPS 就是跑在 TLS 上的 HTTP。' },
    { k: 'authn', zh: '身分驗證', en: 'Authentication, AuthN', l: '06', d: '確認「你是不是你宣稱的那個人」，例如密碼、Passkey。' },
    { k: 'salt', zh: '加鹽', en: 'Salt', l: '06', d: '替每個使用者產生一段隨機值，和密碼一起雜湊，讓相同密碼算出不同結果，預先算好的表因此失效。' },
    { k: 'slow-hash', zh: '慢雜湊', en: 'Password Hashing (bcrypt, Argon2id)', l: '06', d: '刻意設計得很慢、很耗記憶體的雜湊，讓攻擊者每秒只能試很少次。存密碼一定要用它。' },
    { k: 'passkey', zh: '通行金鑰', en: 'Passkey', l: '06', d: '以公開金鑰密碼學取代密碼的登入方式。金鑰綁定網站網域，伺服器只存公鑰，能抵抗釣魚。' },
    { k: 'credential-stuffing', zh: '撞庫', en: 'Credential Stuffing', l: '06', d: '拿 A 網站外洩的帳號密碼，自動化地去其他網站嘗試登入。' },
    { k: 'authz', zh: '授權', en: 'Authorization, AuthZ', l: '07', d: '決定一個已知身分的使用者，能對哪些資源做哪些事。' },
    { k: 'least-privilege', zh: '最小權限', en: 'Least Privilege', l: '07', d: '只給完成工作所需的最少權限，而且只給需要的那段時間。' },
    { k: 'rbac', zh: 'RBAC 角色型存取控制', en: 'Role-Based Access Control', l: '07', d: '權限綁在角色上，使用者透過角色取得權限。常搭配 ABAC（依資料屬性判斷）一起用。' },
    { k: 'idor', zh: 'IDOR／BOLA', en: 'Insecure Direct Object Reference / Broken Object Level Authorization', l: '07', d: '伺服器沒檢查「這筆資料是不是你的」，改網址裡的編號就能存取別人的資料。' },
    { k: 'token', zh: 'Token', en: 'Token (e.g. JWT)', l: '07', d: '登入後伺服器發的憑證，之後每次請求都帶著它。JWT 只是編碼加簽章，內容任何人都讀得到。' },
    { k: 'injection', zh: '注入', en: 'Injection', l: '08', d: '使用者輸入被當成程式的指令執行，改變了程式原本的行為。SQL 注入、命令注入、XSS 都屬於這一類。' },
    { k: 'sql', zh: 'SQL', en: 'Structured Query Language', l: '08', d: '和關聯式資料庫溝通的語言，例如 SELECT name FROM members。' },
    { k: 'param-query', zh: '參數化查詢', en: 'Parameterized Query / Prepared Statement', l: '08', d: '先把查詢結構送給資料庫，再另外送資料，資料永遠只會被當成值，是 SQL 注入的正解。' },
    { k: 'cmd-injection', zh: '命令注入', en: 'Command Injection', l: '08', d: '使用者輸入被作業系統的 shell 當成指令執行。正解是不經過 shell、用參數陣列執行程式。' },
    { k: 'allowlist', zh: '允許清單', en: 'Allowlist', l: '08', d: '只接受事先列出的值，其他一律拒絕。比「列出禁止的值」可靠得多。' },
    { k: 'origin', zh: '來源', en: 'Origin', l: '09', d: '網址的「協定＋網域＋連接埠」，三者完全相同才算同源。' },
    { k: 'sop', zh: '同源政策', en: 'Same-Origin Policy', l: '09', d: '瀏覽器的基本規則：一個來源的程式不能讀取另一個來源的資料。主要限制的是讀取回應，不是送出請求。' },
    { k: 'cors', zh: 'CORS', en: 'Cross-Origin Resource Sharing', l: '09', d: '伺服器主動宣告「允許某個來源讀取我的回應」，是放寬同源政策，不是防護牆。' },
    { k: 'xss', zh: '跨站腳本', en: 'XSS, Cross-Site Scripting', l: '09', d: '攻擊者讓惡意 JavaScript 在網站自己的來源裡執行，擁有網站的全部權限。是注入的瀏覽器版本。' },
    { k: 'csrf', zh: '跨站請求偽造', en: 'CSRF', l: '09', d: '別的網站讓你的瀏覽器帶著你的登入狀態，送出你沒打算送的請求。用 SameSite cookie、CSRF token 防範。' },
    { k: 'csp', zh: '內容安全政策', en: 'CSP, Content Security Policy', l: '09', d: '網站透過回應標頭告訴瀏覽器只能執行哪些來源的腳本，是 XSS 的第二道防線。' },
    { k: 'supply-chain', zh: '軟體供應鏈', en: 'Software Supply Chain', l: '10', d: '從別人寫的套件、工具、建置流程到你部署的程式，中間經過的所有環節。' },
    { k: 'transitive', zh: '遞移相依', en: 'Transitive Dependency', l: '10', d: '你沒有直接安裝、而是被你的套件間接帶進來的套件，數量常是直接相依的數十倍。' },
    { k: 'typosquatting', zh: '名稱搶註', en: 'Typosquatting', l: '10', d: '註冊和熱門套件名字極為相似的套件，等人打錯字時安裝到惡意版本。' },
    { k: 'sbom', zh: 'SBOM 軟體物料清單', en: 'Software Bill of Materials', l: '10', d: '列出軟體裡所有元件和版本的清單，用來快速回答「我們有沒有用到某個有漏洞的元件」。' },
    { k: 'misconfig', zh: '安全設定錯誤', en: 'Security Misconfiguration', l: '10', d: '程式本身沒錯，但設定不當造成的漏洞，例如預設密碼、正式站開著除錯模式、機密被打包進前端。' },
    { k: 'llm', zh: '大型語言模型', en: 'LLM, Large Language Model', l: '11', d: '讀入文字、預測接下來文字的 AI 模型。它把指令和資料放在同一條通道，這是提示詞注入的根源。' },
    { k: 'prompt-injection', zh: '提示詞注入', en: 'Prompt Injection', l: '11', d: '用文字讓模型偏離原本被交代的任務。間接注入把指令藏在模型會讀到的外部內容裡。' },
    { k: 'ai-agent', zh: 'AI 代理', en: 'AI Agent', l: '11', d: '能自己決定呼叫工具（搜尋、寄信、執行程式）來完成任務的 AI 系統。工具權限決定被騙時的傷害。' },
    { k: 'excessive-agency', zh: '過度代理', en: 'Excessive Agency', l: '11', d: 'AI 被賦予了超過任務需要的工具、權限或自主決定權。' },
    { k: 'ssdlc', zh: '安全開發生命週期', en: 'Secure SDLC', l: '12', d: '在需求、設計、開發、測試、部署、維運每個階段都納入安全工作的開發方式。' },
    { k: 'shift-left', zh: '左移', en: 'Shift Left', l: '12', d: '把安全檢查往開發流程的前面移，越早發現越便宜。' },
    { k: 'sast', zh: 'SAST 靜態分析', en: 'Static Application Security Testing', l: '12', d: '不執行程式、直接分析原始碼找出危險寫法。抓不到商業邏輯問題。' },
    { k: 'dast', zh: 'DAST 動態掃描', en: 'Dynamic Application Security Testing', l: '12', d: '對執行中的網站送出各種請求，從外部觀察反應來找漏洞。' },
    { k: 'sca', zh: 'SCA 軟體組成分析', en: 'Software Composition Analysis', l: '12', d: '檢查專案用到的第三方套件有沒有已知漏洞或授權問題。' },
    { k: 'owasp', zh: 'OWASP Top 10', en: 'OWASP Top 10', l: '12', d: '整理最常見、最嚴重的網頁應用程式風險的意識文件，2025 年版是目前最新。是共同語言，不是完整清單。' },
    { k: 'defense-depth', zh: '縱深防禦', en: 'Defense in Depth', l: '13', d: '用多道獨立的防線，讓任何一道失守時攻擊者仍被下一道擋住。關鍵是各層真的獨立。' },
    { k: 'segmentation', zh: '網路分段', en: 'Network Segmentation', l: '13', d: '把網路切成互相隔離的區域，區域間的流量要經過防火牆檢查，用來阻止橫向移動。' },
    { k: 'lateral', zh: '橫向移動', en: 'Lateral Movement', l: '13', d: '攻擊者攻下一台機器後，以它為跳板去攻擊網路內的其他機器。' },
    { k: 'firewall', zh: '防火牆', en: 'Firewall', l: '13', d: '決定哪些流量能通過網路區域邊界的守門機制。' },
    { k: 'zerotrust', zh: '零信任', en: 'Zero Trust', l: '13', d: '不預設信任任何人或任何網路位置，每一次存取都明確驗證身分與權限。' },
    { k: 'blast-radius', zh: '爆炸半徑', en: 'Blast Radius', l: '13', d: '單一環節被攻破時，傷害能波及的範圍。分段和最小權限都是為了縮小它。' },
    { k: 'shared', zh: '共同責任模型', en: 'Shared Responsibility Model', l: '14', d: '雲端商負責雲本身、你負責放進雲裡的資料設定與權限；界線隨服務層級移動，但資料與權限永遠是你的責任。' },
    { k: 'iaas-paas-saas', zh: 'IaaS／PaaS／SaaS', en: 'Infrastructure / Platform / Software as a Service', l: '14', d: '三種雲端服務層級。租得越多現成的，你要管的越少。' },
    { k: 'iam', zh: 'IAM', en: 'Identity and Access Management', l: '14', d: '身分與存取管理。在雲端，它取代實體的牆成為新的邊界。' },
    { k: 'public-bucket', zh: '公開儲存空間', en: 'Public Bucket', l: '14', d: '被設定成任何人都能存取的雲端儲存空間，是最常見的資料外洩原因之一。' },
    { k: 'log', zh: '日誌', en: 'Log', l: '15', d: '系統記下「誰在何時做了什麼」的紀錄。要記安全事件但不記密碼與個資，並集中、同步時間、防竄改。' },
    { k: 'false-pos', zh: '誤報／漏報', en: 'False Positive / False Negative', l: '15', d: '誤報是把正常當攻擊，漏報是真攻擊沒抓到。兩者難以同時降到最低。' },
    { k: 'base-rate', zh: '基本比率謬誤', en: 'Base Rate Fallacy', l: '15', d: '忽略了事件本身很稀有，而高估陽性結果的可信度。攻擊稀有時，高準確率的告警仍多為誤報。' },

    var body = frame(root, '事件分類：這八件事傷害了哪一項？');
    body.append(h('p', null, '每張卡片選出所有受損的性質（可以複選），全部選完再按「檢查答案」。'));
    var items = [
      { t: '購物網站在雙十一當天被大量流量灌爆，整晚連不上。', a: 'A', why: '資料沒被看、也沒被改，但需要用的人用不到。' },
      { t: '有人改了社團的報名表，把三個人的名字刪掉、換成別人。', a: 'I', why: '內容被未經允許地修改。' },
      { t: '員工把含有客戶電話的 Excel，放進「知道連結的人都能看」的雲端資料夾。', a: 'C', why: '不該看的人有機會看到，不管最後有沒有人真的點開。' },
      { t: '勒索軟體把公司檔案全部加密，並威脅不付錢就把資料公開。', a: 'AC', why: '檔案打不開是可用性受損；威脅公開，代表資料已經被偷走，機密性也受損。' },
      { t: '學校網站首頁被換成一張惡作劇圖片。', a: 'I', why: '網站還連得上（可用性沒事），但內容被竄改了。' },
      { t: '硬碟壞掉又沒有備份，一整年的照片都救不回來。', a: 'A', why: '沒有攻擊者也算數：資料再也用不到，就是可用性受損。資安也要防意外。' },
      { t: '有人登入你的信箱，把信全部讀過一遍，但什麼都沒動。', a: 'C', why: '沒有東西被改、被刪，但不該看的人看到了。' },
      { t: '考試系統裡的成績被偷偷改高了 20 分。', a: 'I', why: '資料內容被竄改；如果沒有核對機制，可能永遠不會被發現。' }
    ];
    var NAMES = { C: '機密性', I: '完整性', A: '可用性' };
    var grid = h('div', { class: 'cia-grid' });
    var cards = items.map(function (it, i) {
      var sel = {};
      var fb = h('p', { class: 'cia-fb', hidden: true, 'aria-live': 'polite' });
      var btns = h('div', { class: 'cia-btns', role: 'group', 'aria-label': '第 ' + (i + 1) + ' 張卡片的選擇' });
      ['C', 'I', 'A'].forEach(function (v) {
        var b = h('button', { type: 'button', 'data-v': v, 'aria-pressed': 'false', id: 'cia-' + i + '-' + v }, v, h('small', null, NAMES[v]));
        b.addEventListener('click', function () {
          sel[v] = !sel[v];
          b.setAttribute('aria-pressed', String(sel[v]));
          card.classList.remove('ok', 'bad');
          fb.hidden = true;
        });
        btns.append(b);
      });
      var card = h('div', { class: 'cia-card' }, h('p', null, it.t), btns, fb);
      grid.append(card);
      return { card: card, sel: sel, fb: fb, it: it, btns: btns };
    });
    var out = h('p', { class: 'w-out', 'aria-live': 'polite' });
    var check = h('button', { type: 'button', class: 'btn pri' }, '檢查答案');
    var reset = h('button', { type: 'button', class: 'btn' }, '重來');
    check.addEventListener('click', function () {
      var ok = 0, empty = 0;
      cards.forEach(function (c) {
        var picked = ['C', 'I', 'A'].filter(function (v) { return c.sel[v]; }).join('');
        if (!picked) empty++;
        var right = picked === c.it.a;
        if (right) ok++;
        c.card.classList.toggle('ok', right);
        c.card.classList.toggle('bad', !right);
        c.fb.innerHTML = '';
        c.fb.append(h('b', null, right ? '正確。' : '答案是 ' + c.it.a.split('').map(function (v) { return NAMES[v]; }).join('＋') + '。'), c.it.why);
        c.fb.hidden = false;
      });
      out.textContent = '答對 ' + ok + '／' + items.length + ' 張' + (empty ? '（有 ' + empty + ' 張還沒選）' : '') + (ok === items.length ? '。全對！' : '。紅框的卡片看一下說明，想想差在哪裡。');
    });
    reset.addEventListener('click', function () {
      cards.forEach(function (c) {
        ['C', 'I', 'A'].forEach(function (v) { c.sel[v] = false; });
        c.btns.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
        c.card.classList.remove('ok', 'bad');
        c.fb.hidden = true;
      });
      out.textContent = '';
    });
    body.append(grid, h('div', { class: 'w-row' }, check, reset), out);
  }

  /* ---------- 第 01 課：攻擊面模擬 ---------- */
  function attackSurface(root) {
    var body = frame(root, '攻擊面模擬器：入口越多，越難全部守住');
    body.append(h('p', null, '調整入口數量和每個入口的防護程度，看「全部守住」的機率怎麼變化。再按「模擬攻擊」，讓攻擊者把每一個入口都試一次。'));
    var nIn = h('input', { type: 'range', id: 'as-n', min: '1', max: '60', step: '1', value: '20' });
    var pIn = h('input', { type: 'range', id: 'as-p', min: '80', max: '99.9', step: '0.1', value: '95' });
    var nOut = h('output', { for: 'as-n' }), pOut = h('output', { for: 'as-p' });
    body.append(h('div', { class: 'as-ctl' },
      h('label', { for: 'as-n' }, h('span', null, '入口數量　', nOut), nIn),
      h('label', { for: 'as-p' }, h('span', null, '每個入口守住的機率　', pOut), pIn)));
    var sAll = h('b'), sAny = h('b');
    body.append(h('div', { class: 'as-stats' },
      h('div', { class: 'as-stat good' }, h('small', null, '全部守住的機率'), sAll),
      h('div', { class: 'as-stat bad' }, h('small', null, '至少一個被突破的機率'), sAny)));
    var doors = h('div', { class: 'doors', 'aria-hidden': 'true' });
    body.append(doors);
    var msg = h('p', { class: 'w-out', 'aria-live': 'polite' });
    var b1 = h('button', { type: 'button', class: 'btn pri' }, '模擬攻擊 1 次');
    var b2 = h('button', { type: 'button', class: 'btn' }, '模擬 1,000 次');
    body.append(h('div', { class: 'w-row' }, b1, b2), msg);
    function vals() { return { n: +nIn.value, p: +pIn.value / 100 }; }
    function pct(x) { var v = x * 100; return (v >= 99.95 ? '>99.9' : v < 0.05 ? '<0.1' : v.toFixed(1)) + '%'; }
    function draw() {
      var v = vals();
      nOut.textContent = v.n + ' 個';
      pOut.textContent = (v.p * 100).toFixed(1) + '%';
      var all = Math.pow(v.p, v.n);
      sAll.textContent = pct(all);
      sAny.textContent = pct(1 - all);
      doors.innerHTML = '';
      for (var i = 0; i < v.n; i++) doors.append(h('span', { class: 'door' }));
      msg.textContent = '';
    }
    nIn.addEventListener('input', draw);
    pIn.addEventListener('input', draw);
    b1.addEventListener('click', function () {
      var v = vals(), k = 0;
      Array.prototype.forEach.call(doors.children, function (d) {
        var broken = Math.random() > v.p;
        d.className = 'door ' + (broken ? 'broken' : 'held');
        if (broken) k++;
      });
      msg.textContent = k ? '這次有 ' + k + ' 個入口被突破（紅色）。攻擊者只需要其中一個就能進來。'
        : '這次 ' + v.n + ' 個入口全部守住了。多按幾次，看看運氣能撐多久。';
    });
    b2.addEventListener('click', function () {
      var v = vals(), hit = 0;
      for (var r = 0; r < 1000; r++) for (var i = 0; i < v.n; i++) if (Math.random() > v.p) { hit++; break; }
      msg.textContent = '1,000 次攻擊裡，有 ' + hit.toLocaleString('zh-TW') + ' 次至少突破了一個入口（' + (hit / 10).toFixed(1) + '%）。理論值是 ' + pct(1 - Math.pow(v.p, v.n)) + '。';
    });
    draw();
  }

  /* ---------- 第 02 課：風險矩陣 ---------- */
  function riskMatrix(root) {
    var body = frame(root, '互動風險矩陣：排序、套用對策、看它移動');
    body.append(h('p', null, '左邊是 5×5 風險矩陣，右邊是依分數排好的清單。點一個風險，可以調整它的評估值，或勾選對策，看它在矩陣裡往哪裡移動。也可以加入你自己想到的風險。'));
    var risks = [
      { id: 'R1', name: '登入頁被程式自動化大量猜密碼', L: 4, I: 3, ctl: [{ n: '同一帳號連續失敗 5 次就暫停登入 15 分鐘', dL: -1 }, { n: '啟用多因素驗證（MFA）', dL: -2 }] },
      { id: 'R2', name: '雲端機房整個區域停電', L: 1, I: 4, ctl: [{ n: '在另一個區域準備可切換的備援', dI: -2 }] },
      { id: 'R3', name: '資料庫密碼被 commit 到公開的 GitHub', L: 3, I: 5, ctl: [{ n: 'commit 前自動掃描密碼與金鑰', dL: -2 }, { n: '資料庫只接受自家伺服器連線', dL: -1 }, { n: '個資欄位加密儲存', dI: -1 }] },
      { id: 'R4', name: '客服信箱每天收到大量垃圾廣告信', L: 5, I: 1, ctl: [{ n: '啟用垃圾信過濾', dL: -2 }] }
    ];
    var on = {}; risks.forEach(function (r) { on[r.id] = {}; });
    var sel = 'R3', seq = 5;
    function clamp(v) { return Math.max(1, Math.min(5, v)); }
    function eff(r) {
      var L = r.L, I = r.I;
      r.ctl.forEach(function (c, i) { if (on[r.id][i]) { L += c.dL || 0; I += c.dI || 0; } });
      return { L: clamp(L), I: clamp(I) };
    }
    function level(s) { return s <= 4 ? [1, '低'] : s <= 9 ? [2, '中'] : s <= 16 ? [3, '高'] : [4, '嚴重']; }
    function pill(s) { var lv = level(s); return h('span', { class: 'lvpill lv' + lv[0] }, lv[1] + ' ' + s); }

    var grid = h('div', { class: 'rmx', role: 'group', 'aria-label': '5×5 風險矩陣：縱軸是衝擊，橫軸是可能性' });
    var cells = {};
    for (var I = 5; I >= 1; I--) {
      grid.append(h('div', { class: 'ax' }, I));
      for (var L = 1; L <= 5; L++) {
        var s = L * I;
        var cell = h('div', { class: 'cell lv' + level(s)[0], title: '可能性 ' + L + ' × 衝擊 ' + I + ' = ' + s }, h('span', { class: 'sc', 'aria-hidden': 'true' }, s));
        cells[L + '-' + I] = cell;
        grid.append(cell);
      }
    }
    grid.append(h('div'));
    for (var x = 1; x <= 5; x++) grid.append(h('div', { class: 'ax' }, x));
    var left = h('div', null, h('div', { class: 'rm-y' }, '↑ 衝擊：1 輕微 … 5 災難'), grid,
      h('div', { class: 'rm-axis-t' }, h('span', null, '可能性 →'), h('span', null, '1 很少發生 … 5 幾乎確定')));
    var list = h('ul', { class: 'rm-list2', 'aria-label': '依風險分數排序' });
    var detail = h('div', { class: 'rm-detail' });
    var addIn = h('input', { type: 'text', id: 'rm-add', maxlength: '40', placeholder: '輸入一個你想到的風險', 'aria-label': '新增風險名稱' });
    var addB = h('button', { type: 'button', class: 'btn' }, '加入');
    var right = h('div', null, h('p', { class: 'note', style: 'margin:0 0 6px' }, '處理順序（分數高的在上面）'), list, detail, h('div', { class: 'add-risk' }, addIn, addB));
    body.append(h('div', { class: 'rm-wrap' }, left, right));

    function stepper(label, val, set, idp) {
      var m = h('button', { type: 'button', id: idp + '-m', 'aria-label': label + '減 1' }, '−');
      var p = h('button', { type: 'button', id: idp + '-p', 'aria-label': label + '加 1' }, '+');
      m.addEventListener('click', function () { set(clamp(val - 1)); });
      p.addEventListener('click', function () { set(clamp(val + 1)); });
      return h('span', { class: 'step' }, label, m, h('output', null, val), p);
    }
    function render() {
      keepFocus(root, function () {
        Object.keys(cells).forEach(function (k) { cells[k].querySelectorAll('.rchip').forEach(function (c) { c.remove(); }); });
        risks.forEach(function (r) {
          var e = eff(r);
          if (e.L !== r.L || e.I !== r.I) cells[r.L + '-' + r.I].append(h('span', { class: 'rchip ghost', 'aria-hidden': 'true', title: r.id + ' 套用對策前的位置' }, r.id));
          var chip = h('button', { type: 'button', class: 'rchip' + (r.id === sel ? ' sel' : ''), id: 'chip-' + r.id, 'aria-label': r.id + ' ' + r.name + '，可能性 ' + e.L + '，衝擊 ' + e.I }, r.id);
          chip.addEventListener('click', function () { sel = r.id; render(); });
          cells[e.L + '-' + e.I].append(chip);
        });
        list.innerHTML = '';
        risks.slice().sort(function (a, b) {
          var ea = eff(a), eb = eff(b);
          return (eb.L * eb.I - ea.L * ea.I) || (eb.I - ea.I);
        }).forEach(function (r) {
          var e = eff(r);
          var b = h('button', { type: 'button', id: 'li-' + r.id, 'aria-pressed': String(r.id === sel) },
            h('span', { class: 'id' }, r.id), h('span', null, r.name), pill(e.L * e.I));
          b.addEventListener('click', function () { sel = r.id; render(); });
          list.append(h('li', null, b));
        });
        drawDetail();
      });
    }
    function drawDetail() {
      var r = null;
      risks.forEach(function (x) { if (x.id === sel) r = x; });
      detail.innerHTML = '';
      if (!r) return;
      var e = eff(r), s = e.L * e.I;
      detail.append(h('h5', null, r.id + '　' + r.name));
      detail.append(h('div', null,
        stepper('可能性 ', r.L, function (v) { r.L = v; render(); }, 'st-' + r.id + '-L'),
        stepper('衝擊 ', r.I, function (v) { r.I = v; render(); }, 'st-' + r.id + '-I')));
      detail.append(h('p', { style: 'margin:.5em 0 0' }, (r.ctl.length ? '套用對策後：' : '目前：') + '可能性 ' + e.L + ' × 衝擊 ' + e.I + ' = ', h('b', null, s), '　', pill(s)));
      if (r.ctl.length) {
        var cl = h('div', { class: 'ctl-list' }, h('span', { class: 'note' }, '可以套用的對策：'));
        r.ctl.forEach(function (c, i) {
          var id = 'ctl-' + r.id + '-' + i;
          var cb = h('input', { type: 'checkbox', id: id });
          cb.checked = !!on[r.id][i];
          cb.addEventListener('change', function () { on[r.id][i] = cb.checked; render(); });
          var d = [];
          if (c.dL) d.push('可能性 ' + (c.dL > 0 ? '+' : '−') + Math.abs(c.dL));
          if (c.dI) d.push('衝擊 ' + (c.dI > 0 ? '+' : '−') + Math.abs(c.dI));
          cl.append(h('label', { for: id }, cb, h('span', null, c.n + ' ', h('small', null, '（' + d.join('、') + '）'))));
        });
        detail.append(cl);
      } else {
        detail.append(h('p', { class: 'note', style: 'margin:.4em 0 0' }, '這是你新增的風險。用上面的 − 和 + 調整評估值，想一想你會用四種處理方式中的哪一種。'));
      }
      if (e.I >= 5) detail.append(h('p', { class: 'note', style: 'margin:.4em 0 0' }, '衝擊 5 是災難級：就算可能性很低，也要準備降低衝擊的對策，例如備份、保險、應變計畫。'));
    }
    function addRisk() {
      var v = addIn.value.trim();
      if (!v) { addIn.focus(); return; }
      var id = 'R' + (seq++);
      risks.push({ id: id, name: v, L: 3, I: 3, ctl: [] });
      on[id] = {};
      sel = id;
      addIn.value = '';
      render();
    }
    addB.addEventListener('click', addRisk);
    addIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addRisk(); } });
    render();
  }

      { real: 'discord.js', fake: 'discordjs.js', hint: '多了一個 js。' },
      { real: 'node-fetch', fake: 'nodefetch', hint: '少了連字號。' }
    ];
    var idx = 0, score = 0;
    var q = h('div', { class: 'typo-q' });
    var fb = h('p', { class: 'w-out', 'aria-live': 'polite' });
    var scoreEl = h('span', { class: 'note tabnum' });
    body.append(scoreEl, q, fb);
    function draw() {
      var r = rounds[idx];
      var left = Math.random() < 0.5;
      var a = left ? r.real : r.fake, b = left ? r.fake : r.real;
      scoreEl.textContent = '第 ' + (idx + 1) + '／' + rounds.length + ' 題　答對 ' + score;
      q.innerHTML = '';
      q.append(h('p', { style: 'margin:.2em 0' }, '你想安裝知名套件 ', h('b', null, r.real), '，套件庫搜尋跳出兩個結果：'));
      [a, b].forEach(function (name) {
        var btn = h('button', { type: 'button', class: 'typo-opt' }, h('code', null, 'npm i ' + name));
        btn.addEventListener('click', function () { judge(name === r.real, r); });
        q.append(btn);
      });
    }
    function judge(correct, r) {
      fb.innerHTML = '';
      if (correct) { score++; fb.append(h('b', { class: 'ok-txt' }, '正確。'), r.hint); }
      else fb.append(h('b', { class: 'bad-txt' }, '這是搶註的假套件。'), '正牌是 ' + r.real + '。' + r.hint);
      idx++;
      if (idx >= rounds.length) {
        q.innerHTML = '';
        q.append(h('p', null, '結束，答對 ' + score + '／' + rounds.length + ' 題。實務上別靠眼力：從官方文件或原始碼倉庫複製安裝指令，並確認發布者和倉庫連結。'));
        var again = h('button', { type: 'button', class: 'btn' }, '再玩一次');
        again.addEventListener('click', function () { idx = 0; score = 0; fb.innerHTML = ''; draw(); });
        q.append(again);
        scoreEl.textContent = '答對 ' + score + '／' + rounds.length;
        return;
      }
      draw();
    }
    draw();
  }

  Object.assign(window.WIDGETS, {
    'sqli-sim': sqliSim,
    'origin-check': originCheck,
    'render-modes': renderModes,
    'csrf-flow': csrfFlow,
    'dep-graph': depGraph,
    'typosquat': typosquat
  });
})();

<script>

  /* ---------- 第 11 課：AI 代理權限沙盒（致命三要素） ---------- */
  function agentSandbox(root) {

    var caps = [

      { k: 'untrusted', label: '會接觸不可信內容（網頁、陌生人的信）', factor: 2, note: '這是注入指令的入口。' },

    ];
    var state = { private: false, untrusted: false, exfil: false };

(function () {

  var h = WX.h, frame = WX.frame, uid = WX.id;

  /* ---------- 第 13 課：網路區域與橫向移動（2D／3D） ---------- */
  function networkZones(root) {
    var body = frame(root, '網路區域與橫向移動：攻擊者能走多遠？');
    body.append(h('p', null, '攻擊者已經攻破了對外的網頁伺服器（紅色）。切換三種網路設計，按「模擬橫向移動」，看他能一路走到哪裡。'));
    // 節點與可達性
    var nodes = [
      { id: 'web', label: '網頁伺服器', zone: 'dmz', x: 0 },
      { id: 'api', label: 'API 伺服器', zone: 'app', x: 1 },
      { id: 'db', label: '客戶資料庫', zone: 'data', x: 2 },
      { id: 'admin', label: '管理後台', zone: 'app', x: 1 },
      { id: 'hr', label: '人資系統', zone: 'internal', x: 1 },
      { id: 'backup', label: '備份儲存', zone: 'data', x: 2 }
    ];
    var mode = 'flat';
    var modes = { flat: '沒有分段（大平台）', seg: '有網路分段', zero: '零信任' };
    // 每種模式下，「從 web 出發，攻擊者靠橫向移動能到達哪些」
    function reachable() {
      if (mode === 'flat') return { web: 1, api: 1, db: 1, admin: 1, hr: 1, backup: 1 }; // 全部互通

      try { navigator.clipboard.writeText(out.value).then(done, fail); } catch (e) { fail(); }
    });
    var inp = h('textarea', { id: 'bkIn', 'aria-label': '貼上備份碼', placeholder: '在這裡貼上之前複製的備份碼' });
    var file = h('input', { type: 'file', id: 'bkFile', accept: '.json,.txt,application/json,text/plain', 'aria-label': '或選擇備份檔' });
    var imp = h('button', { type: 'button', class: 'btn pri' }, '匯入進度');
    function doImport(txt) {
      try {
        var o = JSON.parse(txt);
        if (!store.merge(o)) throw new Error('bad');
        store.save(); applyPrefs(); msg.textContent = '匯入完成。'; route();
      } catch (e) { msg.textContent = '這段文字不是有效的備份碼。請確認是完整複製的內容（以 { 開頭、} 結尾）。'; }
    }
    imp.addEventListener('click', function () { if (inp.value.trim()) doImport(inp.value.trim()); else { msg.textContent = '請先貼上備份碼，或選擇備份檔。'; inp.focus(); } });
    file.addEventListener('change', function () {
      var f = file.files && file.files[0];
      if (!f) return;
      var rd = new FileReader();
      rd.onload = function () { doImport(String(rd.result || '')); };
      rd.readAsText(f);
    });
    var reset = h('button', { type: 'button', class: 'btn ghost' }, '清除所有進度');
    var armed = false;
    reset.addEventListener('click', function () {
      if (!armed) { armed = true; reset.textContent = '確定清除？再按一次'; msg.textContent = '這會清除完成紀錄、你寫下的答案和複習佇列，無法復原。'; setTimeout(function () { armed = false; reset.textContent = '清除所有進度'; }, 5000); return; }
      store.d = { done: {}, q: {}, g: {}, prefs: store.d.prefs, cb: {}, ws: {}, last: null };
      store.save(); route();
    });
    sec.append(h('div', { class: 'io' }, out, h('div', { class: 'io-row' }, copy),
      inp, h('div', { class: 'io-row' }, imp, file), h('div', { class: 'io-row' }, reset, msg)));
    return sec;
  }

  /* ---------- global events ---------- */
  function isTyping(t) { return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable); }
  function bind() {
    $('#menuBtn').addEventListener('click', openRail);
    $('#railBg').addEventListener('click', closeRail);
    $('#tocFab').addEventListener('click', openSheet);
    $('#themeBtn').addEventListener('click', function () {
      var order = ['system', 'light', 'dark'], p = store.d.prefs;
      p.theme = order[(order.indexOf(p.theme || 'system') + 1) % 3];
      store.save(); applyPrefs();
    });
    $('#fsBtn').addEventListener('click', function () {
      var order = ['m', 'l', 's'], p = store.d.prefs;
      p.fs = order[(order.indexOf(p.fs || 'm') + 1) % 3];
      store.save(); applyPrefs();
    });
    $('#focusBtn').addEventListener('click', function () { store.d.prefs.focus = !store.d.prefs.focus; store.save(); applyPrefs(); });
    document.addEventListener('click', function (e) {
      var t = e.target;
      var x = t.closest && t.closest('.xref');
      if (x) { e.preventDefault(); openXref(x); return; }
      var d = t.closest && t.closest('dfn[data-term]');
      if (d) { if (tipFor !== d) showTip(d); return; }
      if (popEl && !popEl.contains(t)) closePop();
      if (tipEl) hideTip();
      var a = t.closest && t.closest('a[href^="#"]');
      if (a && a.getAttribute('href') === location.hash) { e.preventDefault(); route(); }
    });
    document.addEventListener('mouseover', function (e) {
      if (!matchMedia('(hover: hover)').matches) return;
      var d = e.target.closest && e.target.closest('dfn[data-term]');
      if (d && tipFor !== d) showTip(d);
    });
    document.addEventListener('mouseout', function (e) {
      var d = e.target.closest && e.target.closest('dfn[data-term]');
      if (d && tipFor === d && !(e.relatedTarget && d.contains(e.relatedTarget))) hideTip();
    });
    document.addEventListener('focusin', function (e) {
      var d = e.target.closest && e.target.closest('dfn[data-term]');
      if (d) showTip(d); else if (tipEl) hideTip();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closePop(); hideTip(); closeSheet(); closeRail(); return; }
      if (isTyping(e.target) || e.altKey || e.ctrlKey || e.metaKey) return;
      if (e.key === 'f' || e.key === 'F') { store.d.prefs.focus = !store.d.prefs.focus; store.save(); applyPrefs(); return; }
      var onBody = e.target === document.body || (e.target.tagName === 'H1');
      if (onBody && /^\d{2}$/.test(cur || '') && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        var i = C.lessons.indexOf(lessonById(cur)) + (e.key === 'ArrowLeft' ? -1 : 1);
        if (C.lessons[i]) { location.hash = 'l' + C.lessons[i].id; e.preventDefault(); }
      }
    });
    window.addEventListener('scroll', function () { onScroll(); if (popEl) closePop(); if (tipEl) hideTip(); }, { passive: true });
    window.addEventListener('resize', onScroll);
    window.addEventListener('hashchange', route);
  }

  store.load();
  window.COURSE_STORE = store;
  buildRail();
  applyPrefs();
  bind();
  route();
})();

</script>
</body>
</html>
